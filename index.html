<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilse // Tactile Matte Audio Deck</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        chassis: '#242528',
                        chassisDark: '#1C1D20',
                        accent: '#E5E7EB',
                    }
                }
            }
        }
    </script>
    <style>
        /* Sleek Custom Scrollbars */
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Matte Neumorphic / Tactile Hardware Surfaces matching Reference */
        @property --rgb-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rgbBorderSpin {
            0% { --rgb-angle: 0deg; }
            100% { --rgb-angle: 360deg; }
        }

        .matte-device {
            position: relative;
            background: linear-gradient(165deg, #2D2E32 0%, #1F2023 55%, #18191B 100%);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.14);
        }

        .recessed-screen {
            position: relative;
            background:
                linear-gradient(145deg, #16171A, #111214) padding-box,
                conic-gradient(
                    from var(--rgb-angle),
                    #ff0055,
                    #ff7b00,
                    #ffe600,
                    #00ff88,
                    #00d4ff,
                    #7b2cbf,
                    #ff0055
                ) border-box;
            border: 2px solid transparent;
            animation: rgbBorderSpin 6s linear infinite;
            box-shadow:
                inset 0 8px 22px rgba(0, 0, 0, 0.85),
                inset 0 1px 3px rgba(0, 0, 0, 0.9),
                0 1px 0 rgba(255, 255, 255, 0.07);
        }

        .recessed-screen::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: inherit;
            background: conic-gradient(
                from var(--rgb-angle),
                #ff0055,
                #ff7b00,
                #ffe600,
                #00ff88,
                #00d4ff,
                #7b2cbf,
                #ff0055
            );
            filter: blur(12px);
            opacity: 0.45;
            z-index: -1;
            pointer-events: none;
            animation: rgbBorderSpin 6s linear infinite;
            transition: opacity 0.35s ease, filter 0.35s ease;
        }

        .rgb-art-playing .recessed-screen::before {
            opacity: 0.78;
            filter: blur(16px);
        }

        .click-wheel-outer {
            background: linear-gradient(145deg, #1E1F22, #292A2E);
            box-shadow:
                10px 14px 28px rgba(0, 0, 0, 0.68),
                -4px -4px 12px rgba(255, 255, 255, 0.04),
                inset 0 1px 1px rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(0, 0, 0, 0.45);
        }

        .click-wheel-center {
            background: linear-gradient(145deg, #28292D, #1B1C1E);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, 0.75),
                0 1px 1px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.5);
        }

        .tactile-round-btn {
            background: linear-gradient(145deg, #2B2C30, #1D1E21);
            box-shadow:
                6px 8px 16px rgba(0, 0, 0, 0.6),
                -2px -2px 8px rgba(255, 255, 255, 0.04),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tactile-round-btn:active {
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.8);
            transform: scale(0.95);
        }
        .tactile-active {
            color: #ffffff !important;
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.78),
                0 0 12px rgba(255, 255, 255, 0.12);
        }

        .active-track-slot {
            background: linear-gradient(180deg, #1A1B1E 0%, #222327 100%);
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.7),
                0 1px 0 rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .mini-dock {
            background: linear-gradient(180deg, #1B1C1F 0%, #151618 100%);
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        /* Animated Mini Equalizer Bars */
        @keyframes eqBounce {
            0%, 100% { height: 25%; }
            50% { height: 100%; }
        }
        .eq-bar { animation: eqBounce 0.7s ease-in-out infinite; }
        .eq-bar:nth-child(2) { animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-[#26272B] text-gray-200 min-h-dvh flex items-center justify-center p-0 selection:bg-white selection:text-black overflow-x-hidden relative">
    <!-- Dual Hardware Deck Container (Smooth 2-Screen Swipe on Mobile, Split 2-Deck on Desktop) -->
    <main id="dual-deck-viewport" class="relative z-10 w-full max-w-[820px] flex md:grid md:grid-cols-2 overflow-x-auto md:overflow-visible snap-x snap-mandatory scroll-smooth no-scrollbar gap-0 md:gap-8 items-stretch md:items-start md:justify-items-center">

        <!-- ========================================================= -->
        <!-- SCREEN 1 (LEFT DEVICE): NOW PLAYING CLICK-WHEEL DECK      -->
        <!-- ========================================================= -->
        <section id="screen-player" class="w-full max-w-none sm:max-w-[400px] md:max-w-[380px] min-h-dvh md:min-h-[680px] shrink-0 snap-start sm:snap-center mx-auto md:mx-0 matte-device rounded-none px-6 py-6 sm:px-7 sm:py-7 flex flex-col justify-between gap-4 relative">
            
            <!-- Top Bar: Left Search, Center DILSE, Right Mute & Queue Switch -->
            <header class="flex items-center justify-between shrink-0">
                <button type="button" id="btn-toggle-search" title="Search Songs" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/[0.05] transition active:scale-90">
                    <i class="ph-bold ph-magnifying-glass text-base pointer-events-none"></i>
                </button>

                <div class="flex flex-col items-center text-center">
                    <span class="text-xs font-semibold tracking-[0.28em] text-gray-200 uppercase">DILSE</span>
                    <span id="mode-indicator" class="hidden">FREE FULL SONGS</span>
                </div>

                <div class="flex items-center gap-1">
                    <button type="button" id="btn-mute" title="Mute / Unmute" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/[0.05] transition active:scale-90">
                        <i id="mute-icon" class="ph-bold ph-speaker-high text-base pointer-events-none"></i>
                    </button>
                    <button type="button" id="btn-go-queue" title="Songs List" class="md:hidden w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/[0.05] transition active:scale-90">
                        <i class="ph-bold ph-list-dashes text-base pointer-events-none"></i>
                    </button>
                </div>
            </header>

            <!-- Collapsible Inline Search Bar -->
            <div id="yt-search-drawer" class="hidden shrink-0">
                <form id="yt-search-form" class="flex items-center gap-2">
                    <input id="yt-search-input" type="text" placeholder="Search song (Chuttamalle, Kissik...)"
                           class="w-full bg-[#151618] border border-white/10 focus:border-white/30 rounded-xl px-3.5 py-2 text-xs text-white placeholder-gray-500 outline-none">
                    <button type="submit" class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-[10px] font-mono font-semibold tracking-wider transition active:scale-95 shrink-0">
                        GO
                    </button>
                </form>
            </div>

            <!-- Spacious Centerpiece: RGB Squircle Album Art + Track Info -->
            <div class="flex-1 flex flex-col items-center justify-center gap-5 my-1 min-h-0">
                <!-- Recessed Squircle Album Art Screen -->
                <div id="art-card" class="w-full max-w-[250px] sm:max-w-[272px] aspect-square mx-auto recessed-screen rounded-[26px] overflow-hidden relative flex items-center justify-center p-1.5 border border-white/[0.04]">
                    <div class="w-full h-full rounded-[20px] overflow-hidden relative bg-[#111214] flex items-center justify-center">
                        <!-- Fallback Emblem -->
                        <div class="flex flex-col items-center justify-center text-white/20 select-none">
                            <i class="ph-duotone ph-waveform text-5xl"></i>
                            <span class="text-[9px] font-mono tracking-widest mt-2">DILSE DECK</span>
                        </div>

                        <!-- Album Artwork -->
                        <img id="cover-art" src="" alt="Album Cover" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700"
                             onerror="this.style.display='none'">

                        <!-- Subtle Screen Vignette -->
                        <div class="absolute inset-0 shadow-[inset_0_0_24px_rgba(0,0,0,0.45)] pointer-events-none"></div>
                    </div>
                </div>

                <!-- Centered Track Title & Singer - Music Director -->
                <div class="text-center w-full px-3">
                    <h1 id="track-title" class="text-base sm:text-lg font-semibold text-gray-100 truncate tracking-tight">Loading Full Songs...</h1>
                    <p id="track-singer-director" class="text-xs text-gray-400 truncate mt-1">Singer - Music Director</p>
                    <span id="track-status" class="hidden">READY</span>
                </div>
            </div>

            <!-- Bottom Controls Stack: Scrubber + Tactile Click Wheel -->
            <div class="flex flex-col gap-5 shrink-0">
                <!-- Minimalist Tactile Scrubber Line with Knob -->
                <div class="px-1">
                    <div id="progress-container" class="w-full h-5 flex items-center cursor-pointer group relative">
                        <div class="w-full h-[3px] bg-white/10 group-hover:bg-white/15 rounded-full overflow-visible relative transition-colors">
                            <div id="progress-bar" class="h-full bg-gray-200 rounded-full w-0 relative transition-all duration-100">
                                <span class="w-3.5 h-3.5 rounded-full bg-[#3A3B3F] group-hover:scale-110 border border-white/30 shadow-[0_2px_6px_rgba(0,0,0,0.85)] absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 transition-transform"></span>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between text-[10px] font-mono text-gray-400 mt-1">
                        <span id="current-time">0:00</span>
                        <span id="duration-time">-0:00</span>
                    </div>
                </div>

                <!-- Authentic Circular Click Wheel Controller -->
                <div class="flex items-center justify-center pb-1">
                    <div class="relative w-44 h-44 sm:w-48 sm:h-48 rounded-full click-wheel-outer flex items-center justify-center select-none">
                        
                        <!-- Top: Shuffle -->
                        <button type="button" id="btn-shuffle" title="Shuffle" class="absolute top-3 left-1/2 -translate-x-1/2 w-9 h-9 rounded-full flex items-center justify-center text-gray-300 hover:text-white active:scale-90 transition">
                            <i class="ph-bold ph-shuffle text-base pointer-events-none"></i>
                        </button>

                        <!-- Left: Previous Track -->
                        <button type="button" id="btn-prev" title="Previous Track" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center text-gray-300 hover:text-white active:scale-90 transition">
                            <i class="ph-fill ph-skip-back text-base pointer-events-none"></i>
                        </button>

                        <!-- Right: Next Track -->
                        <button type="button" id="btn-next" title="Next Track" class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center text-gray-300 hover:text-white active:scale-90 transition">
                            <i class="ph-fill ph-skip-forward text-base pointer-events-none"></i>
                        </button>

                        <!-- Bottom: Play / Pause -->
                        <button type="button" id="btn-play" title="Play / Pause" class="absolute bottom-3 left-1/2 -translate-x-1/2 w-11 h-9 rounded-full flex items-center justify-center text-gray-200 hover:text-white active:scale-90 transition">
                            <i id="play-icon" class="ph-fill ph-play text-lg pointer-events-none"></i>
                        </button>

                        <!-- Diagonal Subtle -10s Rewind & +10s Fast Forward -->
                        <button type="button" id="btn-rw" title="Rewind -10s" class="absolute bottom-6 left-6 w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-mono text-gray-500 hover:text-gray-200 active:scale-90 transition">
                            -10
                        </button>
                        <button type="button" id="btn-ff" title="Fast Forward +10s" class="absolute bottom-6 right-6 w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-mono text-gray-500 hover:text-gray-200 active:scale-90 transition">
                            +10
                        </button>

                        <!-- Center Tactile Like / Favorite Button -->
                        <button type="button" id="btn-center-like" title="Like Current Song" class="w-16 h-16 rounded-full click-wheel-center flex items-center justify-center text-gray-400 hover:text-rose-400 active:scale-95 transition">
                            <i id="center-like-icon" class="ph-bold ph-heart text-lg opacity-60 pointer-events-none"></i>
                        </button>
                    </div>
                </div>

                <!-- Mobile Screen Indicator Dots -->
                <div class="md:hidden flex items-center justify-center gap-1.5">
                    <span class="w-4 h-1 rounded-full bg-white/70"></span>
                    <span class="w-1.5 h-1 rounded-full bg-white/20"></span>
                </div>
            </div>
        </section>

        <!-- ========================================================= -->
        <!-- SCREEN 2 (RIGHT DEVICE): PLAYLIST QUEUE & MINI DOCK DECK  -->
        <!-- ========================================================= -->
        <section id="screen-queue" class="w-full max-w-none sm:max-w-[380px] md:max-w-[360px] min-h-dvh md:min-h-0 shrink-0 snap-start sm:snap-center mx-auto md:mx-0 matte-device rounded-none p-5 sm:p-6 flex flex-col justify-between relative">
            
            <!-- Top Header Bar -->
            <header class="flex items-center justify-between px-1 mb-4">
                <button type="button" id="btn-back-player" title="Back to Player" class="w-7 h-7 rounded-full flex items-center justify-center text-gray-400 hover:text-white transition active:scale-90">
                    <i class="ph-bold ph-caret-left text-sm pointer-events-none"></i>
                </button>

                <span id="queue-header-label" class="text-[10px] font-semibold tracking-[0.2em] text-gray-300 uppercase truncate max-w-[210px]">
                    DILSE • SOUTH INDIA FREE HQ
                </span>

                <span id="queue-count" class="text-[9px] font-mono text-gray-500">0</span>
            </header>

            <!-- Center Mini Squircle Artwork Flanked by Like & Repeat Round Buttons -->
            <div class="flex items-center justify-center gap-5 my-2">
                <!-- Left Round Like Button -->
                <button type="button" id="btn-like-current" title="Like / Favorite Current Song" class="w-10 h-10 rounded-full tactile-round-btn flex items-center justify-center text-gray-300 hover:text-rose-400 transition">
                    <i id="like-current-icon" class="ph-fill ph-heart text-sm pointer-events-none"></i>
                </button>

                <!-- Center Mini Recessed Squircle Album Art -->
                <div class="w-24 h-24 rounded-[22px] recessed-screen p-1.5 flex items-center justify-center shrink-0">
                    <div class="w-full h-full rounded-[17px] overflow-hidden bg-[#121315] relative flex items-center justify-center">
                        <i class="ph-duotone ph-music-notes text-2xl text-white/20"></i>
                        <img id="mini-cover-art" src="" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'">
                    </div>
                </div>

                <!-- Right Round Repeat Button -->
                <button type="button" id="btn-repeat" title="Repeat Track" class="w-10 h-10 rounded-full tactile-round-btn flex items-center justify-center text-gray-300 hover:text-white transition">
                    <i class="ph-bold ph-repeat text-sm pointer-events-none"></i>
                </button>
            </div>

            <!-- Sleek Category / Language Filter Chips -->
            <div id="category-tabs-bar" class="flex items-center gap-1.5 overflow-x-auto py-2.5 mt-2 no-scrollbar shrink-0 border-b border-white/[0.05]">
                <button type="button" id="btn-load-south100" data-cat-index="0" class="cat-tab shrink-0 px-2.5 py-1 rounded-full bg-white/15 text-white text-[10px] font-medium transition">All</button>
                <button type="button" id="btn-trending-tab" data-cat-index="1" class="cat-tab shrink-0 px-2.5 py-1 rounded-full bg-white/[0.04] hover:bg-white/10 text-[10px] text-gray-400 transition">Trending</button>
                <button type="button" id="btn-liked-tab" data-cat-index="2" class="cat-tab shrink-0 px-2.5 py-1 rounded-full bg-white/[0.04] hover:bg-white/10 text-[10px] text-gray-400 transition">Liked (<span id="liked-count">0</span>)</button>
                <button type="button" data-query="Telugu" data-cat-index="3" class="cat-tab quick-chip shrink-0 px-2.5 py-1 rounded-full bg-white/[0.04] hover:bg-white/10 text-[10px] text-gray-400 transition">Telugu</button>
                <button type="button" data-query="Tamil" data-cat-index="4" class="cat-tab quick-chip shrink-0 px-2.5 py-1 rounded-full bg-white/[0.04] hover:bg-white/10 text-[10px] text-gray-400 transition">Tamil</button>
                <button type="button" data-query="Kannada" data-cat-index="5" class="cat-tab quick-chip shrink-0 px-2.5 py-1 rounded-full bg-white/[0.04] hover:bg-white/10 text-[10px] text-gray-400 transition">Kannada</button>
                <button type="button" data-query="Malayalam" data-cat-index="6" class="cat-tab quick-chip shrink-0 px-2.5 py-1 rounded-full bg-white/[0.04] hover:bg-white/10 text-[10px] text-gray-400 transition">Malayalam</button>
            </div>

            <!-- Numbered Tracklist matching Reference Image -->
            <ul id="playlist" class="overflow-y-auto space-y-1 my-2.5 pr-1 h-[245px]">
                <!-- Dynamically Populated Tracks -->
            </ul>

            <!-- Bottom Docked Mini-Player Pill -->
            <div class="mini-dock rounded-2xl p-2 flex items-center justify-between gap-2.5 mt-1">
                <div class="flex items-center gap-2.5 min-w-0">
                    <img id="dock-cover-art" src="https://placehold.co/80x80/18191B/9CA3AF?text=D" alt=""
                         onerror="this.src='https://placehold.co/80x80/18191B/9CA3AF?text=D'"
                         class="w-9 h-9 rounded-xl object-cover bg-black shrink-0 border border-white/10">
                    <p id="dock-track-title" class="text-xs font-medium text-gray-200 truncate">Select a song</p>
                </div>
                <div class="flex items-center gap-2 pr-1 shrink-0">
                    <button type="button" id="btn-dock-like" title="Like" class="p-1.5 text-gray-300 hover:text-rose-400 transition active:scale-90">
                        <i id="dock-like-icon" class="ph-bold ph-heart text-base pointer-events-none"></i>
                    </button>
                    <button type="button" id="btn-dock-play" title="Play / Pause" class="p-1.5 text-gray-200 hover:text-white transition active:scale-90">
                        <i id="dock-play-icon" class="ph-fill ph-play text-base pointer-events-none"></i>
                    </button>
                </div>
            </div>

            <!-- Mobile Screen Indicator Dots -->
            <div class="md:hidden flex items-center justify-center gap-1.5 mt-3">
                <span class="w-1.5 h-1 rounded-full bg-white/20"></span>
                <span class="w-4 h-1 rounded-full bg-white/70"></span>
            </div>
        </section>

    </main>

    <!-- Active Viewport-Safe YouTube IFrame Player Host -->
    <div id="yt-player-host" class="fixed bottom-0 right-0 w-16 h-16 pointer-events-none opacity-[0.01] z-0 overflow-hidden"></div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Custom Matte Toast Notification Box -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-[#1B1C1F] border border-white/15 shadow-2xl text-gray-200 px-4 py-2.5 rounded-xl flex items-center gap-2 text-xs font-mono">
        <i class="ph-fill ph-info text-gray-300 text-sm"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <!-- Complete Self-Contained Audio Player, Search & Free Full-Length Catalog Engine -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM References ---
            const btnPlay = document.getElementById('btn-play');
            const playIcon = document.getElementById('play-icon');
            const btnDockPlay = document.getElementById('btn-dock-play');
            const dockPlayIcon = document.getElementById('dock-play-icon');
            const btnPrev = document.getElementById('btn-prev');
            const btnRw = document.getElementById('btn-rw');
            const btnFf = document.getElementById('btn-ff');
            const btnNext = document.getElementById('btn-next');
            const btnShuffle = document.getElementById('btn-shuffle');
            const btnRepeat = document.getElementById('btn-repeat');
            const btnMute = document.getElementById('btn-mute');
            const muteIcon = document.getElementById('mute-icon');
            const btnToggleSearch = document.getElementById('btn-toggle-search');
            const ytSearchDrawer = document.getElementById('yt-search-drawer');
            const ytSearchForm = document.getElementById('yt-search-form');
            const ytSearchInput = document.getElementById('yt-search-input');
            const btnLikeCurrent = document.getElementById('btn-like-current');
            const likeCurrentIcon = document.getElementById('like-current-icon');
            const btnCenterLike = document.getElementById('btn-center-like');
            const centerLikeIcon = document.getElementById('center-like-icon');
            const btnDockLike = document.getElementById('btn-dock-like');
            const dockLikeIcon = document.getElementById('dock-like-icon');
            const btnLikedTab = document.getElementById('btn-liked-tab');
            const likedCountEl = document.getElementById('liked-count');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');
            const trackTitle = document.getElementById('track-title');
            const dockTrackTitle = document.getElementById('dock-track-title');
            const trackSingerDirector = document.getElementById('track-singer-director');
            const trackStatus = document.getElementById('track-status');
            const modeIndicator = document.getElementById('mode-indicator');
            const queueHeaderLabel = document.getElementById('queue-header-label');
            const coverArt = document.getElementById('cover-art');
            const miniCoverArt = document.getElementById('mini-cover-art');
            const dockCoverArt = document.getElementById('dock-cover-art');
            const playlistEl = document.getElementById('playlist');
            const queueCountEl = document.getElementById('queue-count');
            const btnLoadSouth100 = document.getElementById('btn-load-south100');
            const btnBackPlayer = document.getElementById('btn-back-player');
            const btnGoQueue = document.getElementById('btn-go-queue');
            const dualDeckViewport = document.getElementById('dual-deck-viewport');
            const screenPlayerEl = document.getElementById('screen-player');
            const screenQueueEl = document.getElementById('screen-queue');
            const btnTrendingTab = document.getElementById('btn-trending-tab');
            const quickChips = document.querySelectorAll('.quick-chip');
            const categoryTabs = Array.from(document.querySelectorAll('.cat-tab'));

            const toastEl = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');

            // --- Player State ---
            let playlist = [];
            let currentIndex = 0;
            let activeCategoryIndex = 0;
            let isPlaying = false;
            let isShuffle = false;
            let isRepeat = false;
            let isMuted = false;
            let showingLikedOnly = false;
            const MAX_SONG_DURATION = 600; // Exclude tracks longer than 10 minutes
            let likedSongs = [];
            let toastTimer = null;

            function setActiveCategoryTab(index) {
                activeCategoryIndex = index;
                categoryTabs.forEach((tab, idx) => {
                    const isSelected = idx === index;
                    tab.classList.toggle('bg-white/15', isSelected);
                    tab.classList.toggle('text-white', isSelected);
                    tab.classList.toggle('font-semibold', isSelected);
                    tab.classList.toggle('bg-white/[0.04]', !isSelected);
                    tab.classList.toggle('text-gray-400', !isSelected);
                    if (isSelected && typeof tab.scrollIntoView === 'function') {
                        tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                });
            }

            try {
                likedSongs = JSON.parse(localStorage.getItem('aethersonic_liked_songs') || '[]')
                    .filter(s => s && s.title && (!s.duration || s.duration <= MAX_SONG_DURATION));
            } catch (e) {
                likedSongs = [];
            }

            function saveLikedSongs() {
                try {
                    localStorage.setItem('aethersonic_liked_songs', JSON.stringify(likedSongs));
                } catch (e) {}
                if (likedCountEl) likedCountEl.textContent = likedSongs.length;
                updateCurrentLikeUI();
            }

            function getTrackKey(track) {
                if (!track) return '';
                if (track.trackId) return `id::${track.trackId}`;
                return `${(track.title || '').trim().toLowerCase()}::${(track.singer || '').trim().toLowerCase()}`;
            }

            function isTrackLiked(track) {
                if (!track) return false;
                const key = getTrackKey(track);
                const titleKey = `${(track.title || '').trim().toLowerCase()}::${(track.singer || '').trim().toLowerCase()}`;
                return likedSongs.some(s => getTrackKey(s) === key || `${(s.title || '').trim().toLowerCase()}::${(s.singer || '').trim().toLowerCase()}` === titleKey);
            }

            function updateCurrentLikeUI() {
                const track = playlist[currentIndex];
                const liked = isTrackLiked(track);

                if (likeCurrentIcon) {
                    likeCurrentIcon.className = liked
                        ? 'ph-fill ph-heart text-sm text-rose-500 pointer-events-none'
                        : 'ph-fill ph-heart text-sm text-gray-300 pointer-events-none';
                }
                if (centerLikeIcon) {
                    centerLikeIcon.className = liked
                        ? 'ph-fill ph-heart text-lg text-rose-500 pointer-events-none'
                        : 'ph-bold ph-heart text-lg opacity-60 pointer-events-none';
                }
                if (dockLikeIcon) {
                    dockLikeIcon.className = liked
                        ? 'ph-fill ph-heart text-base text-rose-500 pointer-events-none'
                        : 'ph-bold ph-heart text-base text-gray-300 pointer-events-none';
                }
            }

            window.toggleLikeTrack = function (idx, event) {
                if (event) event.stopPropagation();
                const track = playlist[idx];
                if (!track) return;
                const key = getTrackKey(track);
                const titleKey = `${(track.title || '').trim().toLowerCase()}::${(track.singer || '').trim().toLowerCase()}`;
                const existingIdx = likedSongs.findIndex(s => getTrackKey(s) === key || `${(s.title || '').trim().toLowerCase()}::${(s.singer || '').trim().toLowerCase()}` === titleKey);

                if (existingIdx > -1) {
                    likedSongs.splice(existingIdx, 1);
                    showToast(`Removed "${track.title}" from Liked`);
                    if (showingLikedOnly) {
                        playlist = [...likedSongs];
                        if (currentIndex >= playlist.length) currentIndex = Math.max(0, playlist.length - 1);
                    }
                } else {
                    likedSongs.unshift({ ...track });
                    showToast(`Added "${track.title}" to Liked ❤️`);
                }
                saveLikedSongs();
                renderPlaylist();
            };

            function showToast(msg) {
                if (!toastEl || !toastMsg) return;
                toastMsg.textContent = msg;
                toastEl.classList.remove('translate-y-20', 'opacity-0');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.add('translate-y-20', 'opacity-0');
                }, 2400);
            }

            // HTML5 Audio Element
            const audioEl = new Audio();
            audioEl.preload = 'auto';
            audioEl.volume = 0.85;

            // YouTube Player State
            let ytPlayer = null;
            let ytReady = false;
            let ytPollTimer = null;

            // Verified Healthy Audius Free Streaming Host Discovery
            let audiusHost = 'https://discoveryprovider.audius.co';
            let audiusCandidates = [
                'https://discoveryprovider.audius.co',
                'https://discoveryprovider2.audius.co',
                'https://discoveryprovider3.audius.co'
            ];
            let hostResolvedOnce = false;

            async function probeNodeHealth(nodeUrl) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 1800);
                try {
                    const res = await fetch(`${nodeUrl}/health_check`, { signal: controller.signal });
                    clearTimeout(timer);
                    return res.ok;
                } catch (e) {
                    clearTimeout(timer);
                    return false;
                }
            }

            async function resolveAudiusHost(forceRefresh = false) {
                if (hostResolvedOnce && !forceRefresh) return audiusHost;
                try {
                    if (forceRefresh || !hostResolvedOnce) {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), 2500);
                        const res = await fetch('https://api.audius.co', { signal: controller.signal });
                        clearTimeout(timer);
                        const json = await res.json();
                        if (json && Array.isArray(json.data) && json.data.length > 0) {
                            audiusCandidates = [...json.data].sort(() => Math.random() - 0.5);
                        }
                    }
                    for (const candidate of audiusCandidates.slice(0, 3)) {
                        if (await probeNodeHealth(candidate)) {
                            audiusHost = candidate;
                            hostResolvedOnce = true;
                            return audiusHost;
                        }
                    }
                } catch (e) {
                    audiusHost = 'https://discoveryprovider.audius.co';
                }
                hostResolvedOnce = true;
                return audiusHost;
            }

            function updateMediaSession(track) {
                if (!('mediaSession' in navigator) || !track) return;
                try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: track.title || 'Dilse Track',
                        artist: `${track.singer || 'Artist'} - ${track.musicDirector || 'Music Director'}`,
                        album: track.lang || 'Dilse Free HQ',
                        artwork: track.artwork ? [{ src: track.artwork, sizes: '512x512', type: 'image/jpeg' }] : []
                    });
                    navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
                    navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
                    navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
                    navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
                    navigator.mediaSession.setActionHandler('seekbackward', () => rewindTrack(10));
                    navigator.mediaSession.setActionHandler('seekforward', () => fastForwardTrack(10));
                } catch (e) {}
            }

            const curatedSouthHits = [
                { title: 'Chuttamalle', singer: 'Shilpa Rao', musicDirector: 'Anirudh Ravichander', lang: 'Telugu', duration: 222 },
                { title: 'Kissik', singer: 'Sublahshini', musicDirector: 'Devi Sri Prasad', lang: 'Telugu', duration: 248 },
                { title: 'Fear Song', singer: 'Anirudh Ravichander', musicDirector: 'Anirudh Ravichander', lang: 'Telugu', duration: 196 },
                { title: 'Manasilaayo', singer: 'Malaysia Vasudevan, Anirudh', musicDirector: 'Anirudh Ravichander', lang: 'Tamil', duration: 235 },
                { title: 'Illuminati', singer: 'Dabzee', musicDirector: 'Sushin Shyam', lang: 'Malayalam', duration: 212 },
                { title: 'Dwapara', singer: 'Jaskaran Singh', musicDirector: 'Arjun Janya', lang: 'Kannada', duration: 254 }
            ];

            const castDirectory = [
                { match: /devara|chuttamalle|fear song|daavudi/i, director: 'Anirudh Ravichander' },
                { match: /pushpa|kissik|sooseki|peelings|srivalli|oo antava/i, director: 'Devi Sri Prasad' },
                { match: /kalki|bhairava/i, director: 'Santhosh Narayanan' },
                { match: /guntur kaaram|kurchi|dum masala/i, director: 'Thaman S' },
                { match: /rrr|naatu|komuram|dosti/i, director: 'M. M. Keeravani' },
                { match: /salaar|sooreede/i, director: 'Ravi Basrur' },
                { match: /vettaiyan|manasilaayo|hunter vantaar/i, director: 'Anirudh Ravichander' },
                { match: /leo|naa ready|badass/i, director: 'Anirudh Ravichander' },
                { match: /jailer|kaavaalaa|hukum/i, director: 'Anirudh Ravichander' },
                { match: /aavesham|illuminati|jaada/i, director: 'Sushin Shyam' },
                { match: /kantara|varaha roopam/i, director: 'B. Ajaneesh Loknath' },
                { match: /kgf|toofan|sulthana/i, director: 'Ravi Basrur' },
                { match: /krishnam pranaya|dwapara/i, director: 'Arjun Janya' }
            ];

            function enrichTrackMetadata(item, fallbackLang) {
                const rawTitle = item.trackName || item.title || 'Unknown Track';
                const rawArtists = item.artistName || 'South India Artist';
                const artistParts = rawArtists.split(',').map(s => s.trim()).filter(Boolean);
                const matched = castDirectory.find(entry => entry.match.test(`${rawTitle} ${rawArtists}`));
                const musicDirector = matched ? matched.director : (artistParts.length > 1 ? artistParts[artistParts.length - 1] : artistParts[0]);
                const singer = artistParts.length > 1 ? artistParts.slice(0, -1).join(', ') : artistParts[0];
                return { title: rawTitle, singer, musicDirector };
            }

            function formatTime(sec) {
                if (!sec || isNaN(sec) || sec < 0) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${String(s).padStart(2, '0')}`;
            }

            // --- YouTube IFrame API Integration ---
            window.onYouTubeIframeAPIReady = function () {
                ytPlayer = new YT.Player('yt-player-host', {
                    height: '64',
                    width: '64',
                    playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, playsinline: 1, rel: 0 },
                    events: {
                        onReady: () => { ytReady = true; },
                        onStateChange: (event) => {
                            if (event.data === YT.PlayerState.PLAYING) {
                                setPlayingState(true);
                                startYtProgressPoll();
                            } else if (event.data === YT.PlayerState.PAUSED) {
                                setPlayingState(false);
                                stopYtProgressPoll();
                            } else if (event.data === YT.PlayerState.ENDED) {
                                stopYtProgressPoll();
                                if (isRepeat) {
                                    ytPlayer.seekTo(0);
                                    ytPlayer.playVideo();
                                } else {
                                    nextTrack();
                                }
                            }
                        },
                        onError: () => {
                            const track = playlist[currentIndex];
                            if (track && track.type === 'youtube') {
                                fallbackToDirectStream(track);
                            }
                        }
                    }
                });
            };

            function startYtProgressPoll() {
                stopYtProgressPoll();
                ytPollTimer = setInterval(() => {
                    if (ytPlayer && ytReady && typeof ytPlayer.getCurrentTime === 'function') {
                        const cur = ytPlayer.getCurrentTime() || 0;
                        const dur = ytPlayer.getDuration() || 210;
                        const rem = Math.max(0, dur - cur);
                        currentTimeEl.textContent = formatTime(cur);
                        durationTimeEl.textContent = `-${formatTime(rem)}`;
                        progressBar.style.width = `${Math.min(100, (cur / dur) * 100)}%`;
                    }
                }, 400);
            }

            function stopYtProgressPoll() {
                if (ytPollTimer) {
                    clearInterval(ytPollTimer);
                    ytPollTimer = null;
                }
            }

            async function fallbackToDirectStream(track) {
                try {
                    const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(track.title)}&media=music&entity=song&country=IN&limit=1`);
                    const data = await res.json();
                    if (data.results && data.results.length > 0 && data.results[0].previewUrl) {
                        track.type = 'stream';
                        track.url = data.results[0].previewUrl;
                        track.artwork = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                        loadTrack(currentIndex, true);
                        return;
                    }
                } catch (e) {}
                nextTrack();
            }

            // --- Search Songs Directly ---
            async function searchYouTubeSongs(query) {
                const cleanQuery = query.trim();
                if (!cleanQuery) return;
                showingLikedOnly = false;
                modeIndicator.textContent = `SEARCHING: ${cleanQuery.toUpperCase()}`;

                const searchEndpoints = [
                    `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(cleanQuery + ' full song')}&filter=music_songs`,
                    `https://pipedapi.adminforge.de/search?q=${encodeURIComponent(cleanQuery + ' song')}&filter=videos`,
                    `https://inv.nadeko.net/api/v1/search?q=${encodeURIComponent(cleanQuery + ' song')}&type=video`,
                    `https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(cleanQuery + ' song')}&type=video`
                ];

                let ytResults = [];

                for (const url of searchEndpoints) {
                    try {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), 4500);
                        const res = await fetch(url, { signal: controller.signal });
                        clearTimeout(timer);
                        if (!res.ok) continue;
                        const data = await res.json();

                        const rawItems = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : []);
                        const parsed = rawItems.map(item => {
                            const vidId = item.videoId || (item.url ? extractYouTubeId(item.url) : null);
                            const dur = Number(item.duration || item.lengthSeconds || 0);
                            if (!vidId || (dur > 0 && (dur < 90 || dur > MAX_SONG_DURATION))) return null;
                            const artist = item.uploaderName || item.author || 'YouTube Music';
                            const thumb = item.thumbnail || (Array.isArray(item.videoThumbnails) && item.videoThumbnails[0] ? item.videoThumbnails[0].url : `https://i.ytimg.com/vi/${vidId}/hqdefault.jpg`);
                            return {
                                title: item.title || cleanQuery,
                                singer: artist,
                                musicDirector: 'Official Audio',
                                lang: 'Search',
                                duration: dur || 240,
                                type: 'youtube',
                                videoId: vidId,
                                artwork: thumb
                            };
                        }).filter(Boolean);

                        if (parsed.length > 0) {
                            ytResults = parsed;
                            break;
                        }
                    } catch (e) {}
                }

                if (ytResults.length === 0) {
                    await resolveAudiusHost();
                    try {
                        const audiusRes = await fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(cleanQuery)}&limit=50&app_name=Dilse`);
                        const audiusData = await audiusRes.json();
                        if (audiusData && Array.isArray(audiusData.data)) {
                            ytResults = audiusData.data
                                .filter(item => item && item.id && !item.is_stream_gated && item.duration >= 120 && item.duration <= MAX_SONG_DURATION)
                                .map(item => ({
                                    title: item.title,
                                    singer: (item.user && item.user.name) ? item.user.name : 'Artist',
                                    musicDirector: item.genre || 'Full Track',
                                    lang: 'Free HQ',
                                    duration: item.duration,
                                    type: 'stream',
                                    trackId: item.id,
                                    url: `${audiusHost}/v1/tracks/${item.id}/stream?app_name=Dilse`,
                                    artwork: (item.artwork && (item.artwork['480x480'] || item.artwork['150x150'])) || `https://placehold.co/600x600/18191B/E5E7EB?text=${encodeURIComponent(item.title)}`
                                }));
                        }
                    } catch (e) {}
                }

                if (ytResults.length > 0) {
                    playlist = ytResults;
                    modeIndicator.textContent = `"${cleanQuery.toUpperCase()}" (${playlist.length})`;
                    queueHeaderLabel.textContent = `SEARCH • ${cleanQuery.toUpperCase()}`;
                    loadTrack(0, true);
                    showToast(`Playing "${playlist[0].title}"`);
                } else {
                    modeIndicator.textContent = 'NO RESULTS FOUND';
                    showToast(`No songs found for "${cleanQuery}"`);
                }
            }

            // UI State Updaters
            function setPlayingState(playing) {
                isPlaying = playing;
                playIcon.className = playing ? 'ph-fill ph-pause text-lg pointer-events-none' : 'ph-fill ph-play text-lg pointer-events-none';
                dockPlayIcon.className = playing ? 'ph-fill ph-pause text-base pointer-events-none' : 'ph-fill ph-play text-base pointer-events-none';
                if (screenPlayerEl) screenPlayerEl.classList.toggle('rgb-art-playing', playing);
                if (screenQueueEl) screenQueueEl.classList.toggle('rgb-art-playing', playing);
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
                }
                trackStatus.textContent = playing ? 'PLAYING' : 'PAUSED';
                renderPlaylist();
            }

            function renderPlaylist() {
                queueCountEl.textContent = `${playlist.length}`;
                if (likedCountEl) likedCountEl.textContent = likedSongs.length;
                if (playlist.length === 0) {
                    playlistEl.innerHTML = `<li class="py-12 text-center text-xs text-gray-500">${showingLikedOnly ? 'No liked songs yet. Tap ❤️ on any song!' : 'Loading tracks...'}</li>`;
                    return;
                }
                playlistEl.innerHTML = playlist.map((track, idx) => {
                    const active = idx === currentIndex;
                    const liked = isTrackLiked(track);
                    const singerDirectorText = `${track.singer || 'Artist'} - ${track.musicDirector || 'Music Director'}`;
                    return `
                        <li onclick="window.selectTrack(${idx})"
                            class="group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer transition ${active ? 'active-track-slot text-white' : 'hover:bg-white/[0.04] text-gray-300 border border-transparent'}">
                            <div class="flex items-center gap-3.5 min-w-0">
                                <span class="text-[11px] font-mono w-5 text-center shrink-0 ${active ? 'text-white font-semibold' : 'text-gray-500'}">
                                    ${active && isPlaying ? `
                                        <span class="inline-flex items-end gap-0.5 h-3">
                                            <span class="w-0.5 bg-white eq-bar"></span>
                                            <span class="w-0.5 bg-white eq-bar"></span>
                                            <span class="w-0.5 bg-white eq-bar"></span>
                                        </span>
                                    ` : (idx + 1)}
                                </span>
                                <div class="min-w-0">
                                    <p class="text-xs font-medium truncate ${active ? 'text-white' : 'text-gray-200 group-hover:text-white'}">${track.title}</p>
                                    <p class="text-[10px] text-gray-500 truncate mt-0.5">${singerDirectorText}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0 ml-2">
                                <button type="button" onclick="window.toggleLikeTrack(${idx}, event)" title="${liked ? 'Unlike' : 'Like'}"
                                        class="p-1.5 rounded-full hover:bg-white/10 transition ${liked ? 'text-rose-500' : 'text-gray-500 opacity-75 group-hover:opacity-100 hover:text-rose-400'}">
                                    <i class="${liked ? 'ph-fill' : 'ph-bold'} ph-heart text-sm pointer-events-none"></i>
                                </button>
                            </div>
                        </li>
                    `;
                }).join('');
            }

            window.selectTrack = function (idx) {
                loadTrack(idx, true);
            };

            async function loadTrack(idx, autoPlay = false) {
                if (idx < 0 || idx >= playlist.length) return;
                currentIndex = idx;
                const track = playlist[currentIndex];

                audioEl.pause();
                stopYtProgressPoll();
                if (ytPlayer && ytReady && typeof ytPlayer.stopVideo === 'function') {
                    ytPlayer.stopVideo();
                }

                trackTitle.textContent = track.title;
                dockTrackTitle.textContent = track.title;
                trackSingerDirector.textContent = `${track.singer || 'Artist'} - ${track.musicDirector || 'Music Director'}`;
                currentTimeEl.textContent = '0:00';
                durationTimeEl.textContent = track.duration ? `-${formatTime(track.duration)}` : '-0:00';
                progressBar.style.width = '0%';

                if (track.artwork) {
                    coverArt.style.display = 'block';
                    coverArt.src = track.artwork;
                    miniCoverArt.style.display = 'block';
                    miniCoverArt.src = track.artwork;
                    dockCoverArt.src = track.artwork;
                } else {
                    coverArt.style.display = 'none';
                    miniCoverArt.style.display = 'none';
                }

                updateMediaSession(track);
                updateCurrentLikeUI();
                renderPlaylist();

                if (autoPlay) {
                    await playCurrentTrack();
                } else {
                    setPlayingState(false);
                }
            }

            async function resolveFullSongStream(track) {
                await resolveAudiusHost();
                const searchTerm = `${track.title} ${track.singer || ''}`.trim();
                try {
                    const audiusRes = await fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(searchTerm)}&app_name=Dilse`);
                    const audiusData = await audiusRes.json();
                    if (audiusData && audiusData.data && audiusData.data.length > 0) {
                        const fullMatch = audiusData.data.find(t => !t.is_stream_gated && t.duration && t.duration >= 120 && t.duration <= MAX_SONG_DURATION)
                            || audiusData.data.find(t => !t.is_stream_gated && (!t.duration || t.duration <= MAX_SONG_DURATION));
                        if (fullMatch && fullMatch.id) {
                            track.trackId = fullMatch.id;
                            track.url = `${audiusHost}/v1/tracks/${fullMatch.id}/stream?app_name=Dilse`;
                            track.duration = fullMatch.duration || track.duration;
                            if (!track.artwork && fullMatch.artwork && fullMatch.artwork['480x480']) {
                                track.artwork = fullMatch.artwork['480x480'];
                            }
                            return true;
                        }
                    }
                } catch (e) {}
                return false;
            }

            async function playCurrentTrack() {
                const track = playlist[currentIndex];
                if (!track) {
                    showToast('Loading songs, please wait...');
                    return;
                }

                if (track.type === 'youtube' && track.videoId) {
                    if (ytPlayer && ytReady && typeof ytPlayer.loadVideoById === 'function') {
                        if (isMuted) {
                            ytPlayer.mute();
                        } else {
                            ytPlayer.unMute();
                            ytPlayer.setVolume(Math.round(audioEl.volume * 100));
                        }
                        ytPlayer.loadVideoById(track.videoId);
                        setPlayingState(true);
                    } else {
                        await fallbackToDirectStream(track);
                    }
                    return;
                }

                if (!track.url) {
                    await resolveFullSongStream(track);
                    if (track.artwork) {
                        coverArt.style.display = 'block';
                        coverArt.src = track.artwork;
                        miniCoverArt.style.display = 'block';
                        miniCoverArt.src = track.artwork;
                        dockCoverArt.src = track.artwork;
                    }
                }

                if (track.url) {
                    audioEl.muted = isMuted;
                    if (audioEl.src !== track.url) {
                        audioEl.src = track.url;
                    }
                    try {
                        await audioEl.play();
                        setPlayingState(true);
                    } catch (err) {
                        setPlayingState(false);
                        showToast('Tap Play again to start audio');
                    }
                } else {
                    nextTrack();
                }
            }

            function nextTrack() {
                if (playlist.length === 0) return;
                if (isShuffle && playlist.length > 1) {
                    let nextIdx = currentIndex;
                    while (nextIdx === currentIndex) {
                        nextIdx = Math.floor(Math.random() * playlist.length);
                    }
                    loadTrack(nextIdx, true);
                } else {
                    const nextIdx = (currentIndex + 1) % playlist.length;
                    loadTrack(nextIdx, true);
                }
            }

            function prevTrack() {
                if (playlist.length === 0) return;
                if (audioEl.currentTime > 4) {
                    audioEl.currentTime = 0;
                    return;
                }
                const prevIdx = (currentIndex - 1 + playlist.length) % playlist.length;
                loadTrack(prevIdx, true);
            }

            function togglePlayPause() {
                if (playlist.length === 0) {
                    loadSouthIndiaTop150();
                    return;
                }
                const track = playlist[currentIndex];
                if (!track) return;

                if (track.type === 'youtube' && ytPlayer && ytReady) {
                    if (isPlaying) {
                        ytPlayer.pauseVideo();
                        setPlayingState(false);
                    } else {
                        if (isMuted) ytPlayer.mute();
                        else ytPlayer.unMute();
                        const state = typeof ytPlayer.getPlayerState === 'function' ? ytPlayer.getPlayerState() : -1;
                        if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) {
                            ytPlayer.playVideo();
                            setPlayingState(true);
                        } else {
                            playCurrentTrack();
                        }
                    }
                } else {
                    if (isPlaying) {
                        audioEl.pause();
                        setPlayingState(false);
                    } else if (audioEl.src && audioEl.readyState >= 2) {
                        audioEl.play().then(() => setPlayingState(true)).catch(() => playCurrentTrack());
                    } else {
                        playCurrentTrack();
                    }
                }
            }

            function rewindTrack(seconds = 10) {
                const track = playlist[currentIndex];
                if (!track) return;
                if (track.type === 'youtube' && ytPlayer && ytReady && typeof ytPlayer.getCurrentTime === 'function') {
                    const newTime = Math.max(0, (ytPlayer.getCurrentTime() || 0) - seconds);
                    ytPlayer.seekTo(newTime, true);
                    showToast(`Rewind -${seconds}s`);
                } else if (audioEl.duration && !isNaN(audioEl.duration)) {
                    audioEl.currentTime = Math.max(0, audioEl.currentTime - seconds);
                    showToast(`Rewind -${seconds}s`);
                }
            }

            function fastForwardTrack(seconds = 10) {
                const track = playlist[currentIndex];
                if (!track) return;
                if (track.type === 'youtube' && ytPlayer && ytReady && typeof ytPlayer.getCurrentTime === 'function') {
                    const dur = ytPlayer.getDuration() || track.duration || 210;
                    const newTime = Math.min(dur, (ytPlayer.getCurrentTime() || 0) + seconds);
                    ytPlayer.seekTo(newTime, true);
                    showToast(`Fast Forward +${seconds}s`);
                } else if (audioEl.duration && !isNaN(audioEl.duration)) {
                    audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + seconds);
                    showToast(`Fast Forward +${seconds}s`);
                }
            }

            // --- Fetch All Available Free Complete Full-Length Songs ---
            async function fetchAllFullLengthTracks(queriesList, badgeLabel = 'FREE') {
                await resolveAudiusHost();
                const seenIds = new Set();
                const allFullTracks = [];

                const requests = queriesList.map(q =>
                    fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(q.term)}&limit=100&app_name=Dilse`)
                        .then(r => r.json())
                        .then(data => ({ lang: q.lang, items: (data && data.data) ? data.data : [] }))
                        .catch(() => ({ lang: q.lang, items: [] }))
                );

                const groups = await Promise.all(requests);
                const maxLen = Math.max(0, ...groups.map(g => g.items.length));

                for (let i = 0; i < maxLen; i++) {
                    for (const group of groups) {
                        const item = group.items[i];
                        const isFreeStreamable = item && item.id && !item.is_stream_gated && item.duration && item.duration >= 120 && item.duration <= MAX_SONG_DURATION;
                        if (isFreeStreamable && !seenIds.has(item.id)) {
                            seenIds.add(item.id);
                            const userName = (item.user && item.user.name) ? item.user.name : 'Independent Artist';
                            const meta = enrichTrackMetadata({
                                trackName: item.title,
                                collectionName: item.genre || group.lang,
                                artistName: userName
                            }, group.lang);

                            const art = item.artwork
                                ? (item.artwork['480x480'] || item.artwork['1000x1000'] || item.artwork['150x150'] || '')
                                : '';

                            allFullTracks.push({
                                ...meta,
                                lang: group.lang || badgeLabel,
                                duration: item.duration,
                                type: 'stream',
                                trackId: item.id,
                                url: `${audiusHost}/v1/tracks/${item.id}/stream?app_name=Dilse`,
                                artwork: art || `https://placehold.co/600x600/18191B/E5E7EB?text=${encodeURIComponent(item.title)}`
                            });
                        }
                    }
                }
                return allFullTracks;
            }

            async function loadSouthIndiaTop150() {
                showingLikedOnly = false;
                setActiveCategoryTab(0);
                modeIndicator.textContent = 'LOADING FREE SONGS...';
                queueHeaderLabel.textContent = 'DILSE • ALL FREE SONGS';

                const queries = [
                    { term: 'Telugu', lang: 'Telugu' },
                    { term: 'Tollywood', lang: 'Telugu' },
                    { term: 'Tamil', lang: 'Tamil' },
                    { term: 'Kollywood', lang: 'Tamil' },
                    { term: 'Anirudh', lang: 'Tamil' },
                    { term: 'Kannada', lang: 'Kannada' },
                    { term: 'Sandalwood', lang: 'Kannada' },
                    { term: 'Malayalam', lang: 'Malayalam' },
                    { term: 'Mollywood', lang: 'Malayalam' },
                    { term: 'Indian Remix', lang: 'South' }
                ];

                try {
                    const fullSongs = await fetchAllFullLengthTracks(queries, 'FREE');
                    if (fullSongs.length > 0) {
                        playlist = fullSongs;
                        modeIndicator.textContent = `${playlist.length} FREE FULL SONGS`;
                        loadTrack(0, false);
                    } else {
                        playlist = curatedSouthHits.map(item => ({
                            ...item,
                            type: 'stream',
                            url: '',
                            artwork: `https://placehold.co/600x600/18191B/E5E7EB?text=${encodeURIComponent(item.title)}`
                        }));
                        modeIndicator.textContent = `FREE SONGS (${playlist.length})`;
                        loadTrack(0, false);
                    }
                } catch (err) {
                    modeIndicator.textContent = 'FREE FULL SONGS';
                }
            }

            async function loadTrendingSongs() {
                showingLikedOnly = false;
                setActiveCategoryTab(1);
                modeIndicator.textContent = 'LOADING TRENDING...';
                queueHeaderLabel.textContent = 'DILSE • TRENDING CHARTS';

                try {
                    await resolveAudiusHost();
                    const seenIds = new Set();
                    const trendingTracks = [];

                    const endpoints = [
                        `${audiusHost}/v1/tracks/trending?limit=100&app_name=Dilse`,
                        `${audiusHost}/v1/tracks/trending?time=week&limit=100&app_name=Dilse`,
                        `${audiusHost}/v1/tracks/trending?time=month&limit=100&app_name=Dilse`
                    ];

                    const responses = await Promise.all(
                        endpoints.map(url =>
                            fetch(url).then(r => r.json()).then(d => (d && d.data) ? d.data : []).catch(() => [])
                        )
                    );

                    for (const items of responses) {
                        for (const item of items) {
                            const isFreeStreamable = item && item.id && !item.is_stream_gated && item.duration && item.duration >= 120 && item.duration <= MAX_SONG_DURATION;
                            if (isFreeStreamable && !seenIds.has(item.id)) {
                                seenIds.add(item.id);
                                const userName = (item.user && item.user.name) ? item.user.name : 'Trending Artist';
                                const meta = enrichTrackMetadata({
                                    trackName: item.title,
                                    collectionName: item.genre || 'Trending',
                                    artistName: userName
                                }, 'Trending');
                                const art = item.artwork
                                    ? (item.artwork['480x480'] || item.artwork['1000x1000'] || item.artwork['150x150'] || '')
                                    : '';

                                trendingTracks.push({
                                    ...meta,
                                    lang: 'Trending',
                                    duration: item.duration,
                                    type: 'stream',
                                    trackId: item.id,
                                    url: `${audiusHost}/v1/tracks/${item.id}/stream?app_name=Dilse`,
                                    artwork: art || `https://placehold.co/600x600/18191B/E5E7EB?text=${encodeURIComponent(item.title)}`
                                });
                            }
                        }
                    }

                    if (trendingTracks.length > 0) {
                        playlist = trendingTracks;
                        modeIndicator.textContent = `TRENDING (${playlist.length})`;
                        loadTrack(0, false);
                        showToast(`Loaded ${playlist.length} Trending songs`);
                    }
                } catch (err) {
                    showToast('Failed to load Trending songs.');
                }
            }

            async function searchSongs(query, tabIndex = null) {
                if (!query.trim()) return;
                showingLikedOnly = false;
                if (tabIndex !== null) setActiveCategoryTab(tabIndex);
                modeIndicator.textContent = `${query.toUpperCase()} SONGS`;
                queueHeaderLabel.textContent = `DILSE • ${query.toUpperCase()}`;

                try {
                    await resolveAudiusHost();
                    const seenIds = new Set();
                    const fullTracks = [];
                    const terms = [query, `${query} song`, `${query} hits`, `${query} remix`];

                    const responses = await Promise.all(
                        terms.map(t =>
                            fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(t)}&limit=100&app_name=Dilse`)
                                .then(r => r.json())
                                .then(d => (d && d.data) ? d.data : [])
                                .catch(() => [])
                        )
                    );

                    for (const items of responses) {
                        for (const item of items) {
                            const isFreeStreamable = item && item.id && !item.is_stream_gated && item.duration && item.duration >= 120 && item.duration <= MAX_SONG_DURATION;
                            if (isFreeStreamable && !seenIds.has(item.id)) {
                                seenIds.add(item.id);
                                const userName = (item.user && item.user.name) ? item.user.name : 'Independent Artist';
                                const meta = enrichTrackMetadata({
                                    trackName: item.title,
                                    collectionName: item.genre || query,
                                    artistName: userName
                                }, query);
                                const art = item.artwork
                                    ? (item.artwork['480x480'] || item.artwork['1000x1000'] || item.artwork['150x150'] || '')
                                    : '';

                                fullTracks.push({
                                    ...meta,
                                    lang: query,
                                    duration: item.duration,
                                    type: 'stream',
                                    trackId: item.id,
                                    url: `${audiusHost}/v1/tracks/${item.id}/stream?app_name=Dilse`,
                                    artwork: art || `https://placehold.co/600x600/18191B/E5E7EB?text=${encodeURIComponent(item.title)}`
                                });
                            }
                        }
                    }

                    if (fullTracks.length > 0) {
                        playlist = fullTracks;
                        modeIndicator.textContent = `${playlist.length} ${query.toUpperCase()} SONGS`;
                        loadTrack(0, true);
                        showToast(`Loaded ${playlist.length} ${query} songs`);
                    } else {
                        showToast(`No free songs found for "${query}"`);
                    }
                } catch (e) {
                    showToast('Failed to load free songs.');
                }
            }

            function extractYouTubeId(input) {
                const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
                const match = input.match(regExp);
                if (match && match[1]) return match[1];
                if (/^[a-zA-Z0-9_-]{11}$/.test(input.trim())) return input.trim();
                return null;
            }

            // --- Event Listeners ---
            btnPlay.addEventListener('click', togglePlayPause);
            btnDockPlay.addEventListener('click', togglePlayPause);
            btnPrev.addEventListener('click', prevTrack);
            btnRw.addEventListener('click', () => rewindTrack(10));
            btnFf.addEventListener('click', () => fastForwardTrack(10));
            btnNext.addEventListener('click', nextTrack);
            btnLikeCurrent.addEventListener('click', () => window.toggleLikeTrack(currentIndex));
            btnCenterLike.addEventListener('click', () => window.toggleLikeTrack(currentIndex));
            btnDockLike.addEventListener('click', () => window.toggleLikeTrack(currentIndex));
            btnTrendingTab.addEventListener('click', loadTrendingSongs);
            function scrollToDeckScreen(targetEl) {
                if (!targetEl) return;
                if (dualDeckViewport && window.innerWidth < 768) {
                    const targetLeft = targetEl.offsetLeft;
                    dualDeckViewport.scrollTo({ left: targetLeft, behavior: 'smooth' });
                } else {
                    targetEl.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                }
            }

            if (btnGoQueue && dualDeckViewport && screenQueueEl) {
                btnGoQueue.addEventListener('click', () => {
                    scrollToDeckScreen(screenQueueEl);
                });
            }
            if (btnBackPlayer && dualDeckViewport && screenPlayerEl) {
                btnBackPlayer.addEventListener('click', () => {
                    if (window.innerWidth < 768) {
                        scrollToDeckScreen(screenPlayerEl);
                    } else {
                        loadSouthIndiaTop150();
                    }
                });
            }

            // Touch swipe helper for crisp right/left screen transitions on mobile
            let touchStartX = 0;
            let touchStartY = 0;
            if (dualDeckViewport) {
                dualDeckViewport.addEventListener('touchstart', (e) => {
                    if (!e.touches || e.touches.length === 0) return;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                dualDeckViewport.addEventListener('touchend', (e) => {
                    if (window.innerWidth >= 768 || !e.changedTouches || e.changedTouches.length === 0) return;
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
                        if (dx < 0 && screenQueueEl) {
                            scrollToDeckScreen(screenQueueEl);
                        } else if (dx > 0 && screenPlayerEl) {
                            scrollToDeckScreen(screenPlayerEl);
                        }
                    }
                }, { passive: true });
            }

            btnToggleSearch.addEventListener('click', () => {
                ytSearchDrawer.classList.toggle('hidden');
                if (!ytSearchDrawer.classList.contains('hidden')) {
                    ytSearchInput.focus();
                }
            });

            ytSearchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const q = ytSearchInput.value.trim();
                if (q) {
                    searchYouTubeSongs(q);
                    ytSearchDrawer.classList.add('hidden');
                }
            });

            btnLikedTab.addEventListener('click', () => {
                setActiveCategoryTab(2);
                queueHeaderLabel.textContent = 'DILSE • LIKED SONGS';
                if (likedSongs.length === 0) {
                    showingLikedOnly = true;
                    playlist = [];
                    modeIndicator.textContent = 'LIKED SONGS (0)';
                    renderPlaylist();
                    showToast('No liked songs yet! Tap ❤️ on any song.');
                    return;
                }
                showingLikedOnly = true;
                playlist = [...likedSongs];
                modeIndicator.textContent = `LIKED (${playlist.length})`;
                loadTrack(0, false);
                showToast(`Showing ${playlist.length} Liked Songs ❤️`);
            });

            btnShuffle.addEventListener('click', () => {
                isShuffle = !isShuffle;
                btnShuffle.classList.toggle('text-white', isShuffle);
                btnShuffle.classList.toggle('font-bold', isShuffle);
                btnShuffle.classList.toggle('text-gray-300', !isShuffle);
                showToast(`Shuffle: ${isShuffle ? 'ON' : 'OFF'}`);
            });

            btnRepeat.addEventListener('click', () => {
                isRepeat = !isRepeat;
                btnRepeat.classList.toggle('tactile-active', isRepeat);
                btnRepeat.classList.toggle('text-gray-300', !isRepeat);
                showToast(`Repeat Track: ${isRepeat ? 'ON' : 'OFF'}`);
            });

            btnMute.addEventListener('click', () => {
                isMuted = !isMuted;
                audioEl.muted = isMuted;
                if (ytPlayer && ytReady) {
                    if (isMuted) ytPlayer.mute();
                    else ytPlayer.unMute();
                }
                muteIcon.className = isMuted
                    ? 'ph-bold ph-speaker-slash text-base pointer-events-none'
                    : 'ph-bold ph-speaker-high text-base pointer-events-none';
                btnMute.classList.toggle('text-white', isMuted);
                showToast(isMuted ? 'Audio Muted' : 'Audio Unmuted');
            });

            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                const track = playlist[currentIndex];
                if (track && track.type === 'youtube' && ytPlayer && ytReady) {
                    const dur = ytPlayer.getDuration() || track.duration || 210;
                    ytPlayer.seekTo(pct * dur, true);
                } else if (audioEl.duration && !isNaN(audioEl.duration)) {
                    audioEl.currentTime = pct * audioEl.duration;
                }
            });

            audioEl.addEventListener('timeupdate', () => {
                const track = playlist[currentIndex];
                const cur = audioEl.currentTime || 0;
                const dur = (audioEl.duration && !isNaN(audioEl.duration)) ? audioEl.duration : (track && track.duration ? track.duration : 0);
                currentTimeEl.textContent = formatTime(cur);
                if (dur > 0) {
                    const rem = Math.max(0, dur - cur);
                    durationTimeEl.textContent = `-${formatTime(rem)}`;
                    progressBar.style.width = `${Math.min(100, (cur / dur) * 100)}%`;
                }
            });

            audioEl.addEventListener('error', async () => {
                const track = playlist[currentIndex];
                if (track && track.trackId && !track.retriedHost) {
                    track.retriedHost = true;
                    await resolveAudiusHost(true);
                    track.url = `${audiusHost}/v1/tracks/${track.trackId}/stream?app_name=Dilse`;
                    audioEl.src = track.url;
                    audioEl.play().catch(() => nextTrack());
                    return;
                }
                nextTrack();
            });

            audioEl.addEventListener('ended', () => {
                if (isRepeat) {
                    audioEl.currentTime = 0;
                    audioEl.play().catch(() => {});
                } else {
                    nextTrack();
                }
            });

            btnLoadSouth100.addEventListener('click', loadSouthIndiaTop150);

            quickChips.forEach(chip => {
                chip.addEventListener('click', () => {
                    const q = chip.getAttribute('data-query');
                    const idx = Number(chip.getAttribute('data-cat-index'));
                    searchSongs(q, isNaN(idx) ? null : idx);
                });
            });

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlayPause();
                } else if (e.code === 'ArrowRight') {
                    nextTrack();
                } else if (e.code === 'ArrowLeft') {
                    prevTrack();
                }
            });

            saveLikedSongs();
            loadSouthIndiaTop150();
        });
    </script>
