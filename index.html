<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilse // Tactile Audio Deck</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        chassis: '#131417',
                        panel: '#1C1E24',
                        accent: '#FF5500',
                        accentGlow: 'rgba(255, 85, 0, 0.4)',
                        cyber: '#00F0FF',
                        vinyl: '#0B0C0E',
                    },
                    animation: {
                        'spin-slow': 'spin 5s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        /* Sleek Custom Scrollbars & Tactile Hardware Polish */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 999px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #FF5500; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animated Mini Equalizer Bars for Active Queue Item */
        @keyframes eqBounce {
            0%, 100% { height: 25%; }
            50% { height: 100%; }
        }
        .eq-bar { animation: eqBounce 0.7s ease-in-out infinite; }
        .eq-bar:nth-child(2) { animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-[#07080A] text-gray-200 min-h-screen flex items-center justify-center p-3 sm:p-6 pb-28 sm:pb-32 selection:bg-accent selection:text-white overflow-x-hidden relative">

    <!-- Blurred Dynamic Album Art Backdrop -->
    <div id="bg-artwork-blur" class="fixed inset-0 pointer-events-none opacity-25 scale-125 blur-3xl bg-cover bg-center transition-all duration-1000 z-0"></div>

    <!-- Ambient Background Glow -->
    <div id="ambient-glow" class="fixed inset-0 pointer-events-none opacity-35 transition-all duration-1000 blur-3xl z-0"
         style="background: radial-gradient(circle at 50% 50%, #FF5500 0%, transparent 65%);"></div>

    <!-- Main Hardware Chassis -->
    <main class="relative z-10 w-full max-w-5xl bg-chassis/85 backdrop-blur-2xl border border-white/15 rounded-3xl shadow-[0_30px_90px_-15px_rgba(0,0,0,0.95),inset_0_1px_1px_rgba(255,255,255,0.12)] overflow-visible">
        
        <!-- Top Hardware Bezel / Header: Left Speed (1x), Center Brand, Right Mute -->
        <header class="relative flex items-center justify-between px-4 sm:px-6 py-3.5 bg-panel/80 backdrop-blur-md border-b border-white/10 rounded-t-3xl z-30">
            
            <!-- Left: Playback Speed Toggle -->
            <button id="btn-speed" title="Playback Speed" class="px-2.5 py-2 rounded-xl bg-black/50 hover:bg-white/10 text-gray-300 hover:text-white border border-white/10 transition active:scale-95 text-[11px] sm:text-xs font-mono font-bold min-w-[44px]">
                1x
            </button>

            <!-- Center: Brand Title -->
            <div class="flex flex-col items-center justify-center text-center">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-accent animate-pulse shadow-[0_0_10px_#FF5500]"></span>
                    <span class="font-bold tracking-[0.22em] text-sm sm:text-base text-white">DILSE</span>
                    <span class="hidden sm:inline-block px-1.5 py-0.5 rounded bg-accent/15 border border-accent/30 text-[9px] font-mono text-accent">MK-V</span>
                </div>
                <span id="mode-indicator" class="text-[10px] font-mono text-gray-400 tracking-wider mt-0.5 truncate max-w-[180px] sm:max-w-none">SOUTH INDIA CLOUD HQ</span>
            </div>

            <!-- Right: Mute / Unmute Toggle -->
            <button id="btn-mute" title="Mute / Unmute" class="p-2 rounded-xl bg-black/50 hover:bg-white/10 text-gray-400 hover:text-white border border-white/10 transition active:scale-95">
                <i id="mute-icon" class="ph-bold ph-speaker-high text-base sm:text-lg"></i>
            </button>

        </header>

        <!-- Main Deck Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 p-4 sm:p-6">

            <!-- Left Column: Modern Holographic Floating Artwork Stage (6 cols on lg) -->
            <div class="lg:col-span-6 flex flex-col justify-between gap-4">
                
                <!-- Sleek Glassmorphic Album Stage -->
                <div class="relative bg-gradient-to-br from-[#12141A] via-[#0B0C10] to-[#08090C] border border-white/10 rounded-2xl p-6 flex flex-col items-center justify-center shadow-[inset_0_1px_1px_rgba(255,255,255,0.08),0_20px_50px_rgba(0,0,0,0.85)] overflow-hidden min-h-[290px] sm:min-h-[340px] flex-1">
                    
                    <!-- Ambient Orbiting Energy Halo -->
                    <div id="cover-halo" class="absolute w-64 h-64 sm:w-72 sm:h-72 rounded-full bg-gradient-to-tr from-accent/35 via-cyber/25 to-purple-500/35 blur-2xl transition-all duration-700 scale-90 opacity-40 pointer-events-none"></div>

                    <!-- Floating Rounded-Square Album Art Frame -->
                    <div id="art-card" class="relative w-52 h-52 sm:w-64 sm:h-64 rounded-3xl overflow-hidden border border-white/20 bg-[#14161D] shadow-[0_25px_60px_-10px_rgba(0,0,0,0.95)] transition-all duration-500 flex items-center justify-center group">
                        
                        <!-- Fallback Geometric Emblem -->
                        <div class="flex flex-col items-center justify-center text-white/25 select-none">
                            <i class="ph-duotone ph-waveform text-6xl text-accent/60"></i>
                            <span class="text-[10px] font-mono tracking-widest mt-2">DILSE AUDIO</span>
                        </div>

                        <!-- Crisp Full-Bleed Album Artwork -->
                        <img id="cover-art" src="" alt="Album Cover" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700"
                             onerror="this.style.display='none'">

                        <!-- Subtle Glass Gloss Reflection -->
                        <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-white/15 pointer-events-none"></div>
                    </div>
                </div>

            </div>

            <!-- Right Column: OLED Display, Controls & Top 150 South India Playlist (6 cols on lg) -->
            <div class="lg:col-span-6 flex flex-col justify-between gap-4">
                
                <!-- Retro OLED Track Readout -->
                <div class="bg-[#060709] border border-white/15 rounded-2xl p-4 sm:p-5 shadow-[inset_0_2px_20px_rgba(0,0,0,1),0_10px_25px_rgba(0,0,0,0.4)] relative overflow-hidden">
                    <div class="absolute inset-0 pointer-events-none opacity-10"
                         style="background: repeating-linear-gradient(0deg, transparent, transparent 2px, #fff 3px);"></div>
                    
                    <div class="flex items-center justify-between text-[11px] font-mono text-accent mb-1">
                        <span id="track-status">READY // STANDBY</span>
                        <div class="flex items-center gap-2">
                            <span id="track-bpm" class="px-2 py-0.5 rounded bg-accent/15 border border-accent/30 text-[10px]">FULL TRACK</span>
                            <button id="btn-like-current" title="Like / Favorite Current Song" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/15 border border-white/10 text-gray-400 hover:text-rose-500 transition active:scale-90">
                                <i id="like-current-icon" class="ph-bold ph-heart text-sm"></i>
                            </button>
                        </div>
                    </div>
                    
                    <h1 id="track-title" class="text-xl sm:text-2xl font-bold text-white truncate tracking-tight mt-1">Loading All Full-Length Songs...</h1>
                    
                    <!-- Structured Track Metadata: Singer - Music Director -->
                    <div class="mt-2 space-y-1 text-xs font-mono">
                        <p class="flex items-center gap-1.5 text-gray-200 truncate">
                            <i class="ph-fill ph-microphone-stage text-accent shrink-0"></i>
                            <span id="track-singer-director" class="truncate">Singer - Music Director</span>
                        </p>
                    </div>

                    <!-- Scrubber / Progress Bar -->
                    <div class="mt-4">
                        <div id="progress-container" class="w-full h-2.5 bg-white/10 rounded-full cursor-pointer relative overflow-hidden group">
                            <div id="progress-bar" class="h-full bg-gradient-to-r from-accent to-amber-400 rounded-full w-0 transition-all duration-100 shadow-[0_0_10px_rgba(255,85,0,0.6)]"></div>
                        </div>
                        <div class="flex justify-between text-[11px] font-mono text-gray-400 mt-1.5">
                            <span id="current-time">00:00</span>
                            <span id="duration-time">00:00</span>
                        </div>
                    </div>
                </div>

                <!-- Full-Length South India Trending Track Queue -->
                <div class="bg-black/55 backdrop-blur-md border border-white/10 rounded-2xl p-3 flex-1 flex flex-col min-h-[280px] max-h-[340px] shadow-inner">
                    <div class="flex items-center justify-between px-2 pb-2 border-b border-white/10 text-[11px] font-mono text-gray-400">
                        <span class="flex items-center gap-1.5 text-white font-semibold">
                            <i class="ph-fill ph-fire text-accent"></i> ALL FREE FULL-LENGTH SONGS
                        </span>
                        <span id="queue-count" class="text-accent">LOADING...</span>
                    </div>
                    <!-- South Indian Language & Chart Filter Chips -->
                    <div id="category-tabs-bar" class="flex items-center gap-1.5 overflow-x-auto py-2 px-1 no-scrollbar shrink-0">
                        <button type="button" id="btn-load-south100" data-cat-index="0" class="cat-tab shrink-0 px-2.5 py-1 rounded-lg bg-accent text-white border border-accent text-[10px] font-mono font-bold transition">All Free Songs</button>
                        <button type="button" id="btn-trending-tab" data-cat-index="1" class="cat-tab shrink-0 px-2.5 py-1 rounded-lg bg-white/5 hover:bg-amber-500/20 hover:text-amber-400 hover:border-amber-500/40 border border-white/10 text-[10px] font-mono text-gray-300 transition flex items-center gap-1">
                            <i class="ph-fill ph-trend-up text-amber-400"></i> Trending
                        </button>
                        <button type="button" id="btn-liked-tab" data-cat-index="2" class="cat-tab shrink-0 px-2.5 py-1 rounded-lg bg-white/5 hover:bg-rose-500/20 hover:text-rose-400 hover:border-rose-500/40 border border-white/10 text-[10px] font-mono text-gray-300 transition flex items-center gap-1">
                            <i class="ph-fill ph-heart text-rose-500"></i> Liked (<span id="liked-count">0</span>)
                        </button>
                        <button type="button" data-query="Telugu" data-cat-index="3" class="cat-tab quick-chip shrink-0 px-2.5 py-1 rounded-lg bg-white/5 hover:bg-accent hover:text-white border border-white/10 text-[10px] font-mono text-gray-300 transition">Telugu</button>
                        <button type="button" data-query="Tamil" data-cat-index="4" class="cat-tab quick-chip shrink-0 px-2.5 py-1 rounded-lg bg-white/5 hover:bg-accent hover:text-white border border-white/10 text-[10px] font-mono text-gray-300 transition">Tamil</button>
                        <button type="button" data-query="Kannada" data-cat-index="5" class="cat-tab quick-chip shrink-0 px-2.5 py-1 rounded-lg bg-white/5 hover:bg-accent hover:text-white border border-white/10 text-[10px] font-mono text-gray-300 transition">Kannada</button>
                        <button type="button" data-query="Malayalam" data-cat-index="6" class="cat-tab quick-chip shrink-0 px-2.5 py-1 rounded-lg bg-white/5 hover:bg-accent hover:text-white border border-white/10 text-[10px] font-mono text-gray-300 transition">Malayalam</button>
                    </div>
                    <ul id="playlist" class="overflow-y-auto divide-y divide-white/5 pr-1 space-y-1">
                        <!-- Dynamically Populated with All Available Full Songs -->
                    </ul>
                </div>

            </div>
        </div>
    </main>

    <!-- Fixed Bottom Playback Footer Bar -->
    <footer class="fixed bottom-0 left-0 right-0 z-40 bg-chassis/95 backdrop-blur-2xl border-t border-white/15 px-3 sm:px-6 py-2.5 sm:py-3 shadow-[0_-15px_40px_rgba(0,0,0,0.85)]">
        <div class="max-w-5xl mx-auto flex items-center justify-center">
            
            <!-- Primary Transport Buttons -->
            <div class="flex items-center justify-center gap-1.5 sm:gap-2.5 w-full sm:w-auto flex-wrap sm:flex-nowrap">
                <button id="btn-shuffle" title="Shuffle" class="p-2.5 sm:p-3 rounded-xl bg-black/50 hover:bg-white/10 text-gray-400 hover:text-white border border-white/10 transition active:scale-95">
                    <i class="ph-bold ph-shuffle text-base sm:text-lg"></i>
                </button>
                
                <button id="btn-prev" title="Previous Track" class="p-2.5 sm:p-3 rounded-xl bg-black/60 hover:bg-white/15 text-white border border-white/10 transition active:scale-95 shadow-md">
                    <i class="ph-fill ph-skip-back text-lg sm:text-xl"></i>
                </button>

                <button id="btn-rw" title="Rewind (-10s)" class="p-2.5 sm:p-3 rounded-xl bg-black/60 hover:bg-white/15 text-white border border-white/10 transition active:scale-95 shadow-md">
                    <i class="ph-fill ph-rewind text-lg sm:text-xl"></i>
                </button>

                <button id="btn-play" title="Play / Pause" class="px-5 sm:px-6 py-3 sm:py-3.5 rounded-2xl bg-gradient-to-tr from-accent to-orange-500 hover:brightness-110 text-white shadow-[0_0_25px_rgba(255,85,0,0.55)] transition transform active:scale-95 flex items-center justify-center border border-white/20">
                    <i id="play-icon" class="ph-fill ph-play text-xl sm:text-2xl"></i>
                </button>

                <button id="btn-ff" title="Fast Forward (+10s)" class="p-2.5 sm:p-3 rounded-xl bg-black/60 hover:bg-white/15 text-white border border-white/10 transition active:scale-95 shadow-md">
                    <i class="ph-fill ph-fast-forward text-lg sm:text-xl"></i>
                </button>

                <button id="btn-next" title="Next Track" class="p-2.5 sm:p-3 rounded-xl bg-black/60 hover:bg-white/15 text-white border border-white/10 transition active:scale-95 shadow-md">
                    <i class="ph-fill ph-skip-forward text-lg sm:text-xl"></i>
                </button>

                <button id="btn-repeat" title="Repeat Track" class="p-2.5 sm:p-3 rounded-xl bg-black/50 hover:bg-white/10 text-gray-400 hover:text-white border border-white/10 transition active:scale-95">
                    <i class="ph-bold ph-repeat text-base sm:text-lg"></i>
                </button>
            </div>

        </div>
    </footer>

    <!-- Active Viewport-Safe YouTube IFrame Player Host -->
    <div id="yt-player-host" class="fixed bottom-0 right-0 w-16 h-16 pointer-events-none opacity-[0.01] z-0 overflow-hidden"></div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Custom Toast Notification Box -->
    <div id="toast" class="fixed bottom-24 sm:bottom-20 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-panel border border-accent/50 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-xs font-mono">
        <i class="ph-fill ph-info text-accent text-base"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <!-- Complete Self-Contained Audio Player, Search & South India Top 150 Engine -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM References ---
            const btnPlay = document.getElementById('btn-play');
            const playIcon = document.getElementById('play-icon');
            const btnPrev = document.getElementById('btn-prev');
            const btnRw = document.getElementById('btn-rw');
            const btnFf = document.getElementById('btn-ff');
            const btnNext = document.getElementById('btn-next');
            const btnShuffle = document.getElementById('btn-shuffle');
            const btnRepeat = document.getElementById('btn-repeat');
            const btnSpeed = document.getElementById('btn-speed');
            const btnMute = document.getElementById('btn-mute');
            const muteIcon = document.getElementById('mute-icon');
            const btnLikeCurrent = document.getElementById('btn-like-current');
            const likeCurrentIcon = document.getElementById('like-current-icon');
            const btnLikedTab = document.getElementById('btn-liked-tab');
            const likedCountEl = document.getElementById('liked-count');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');
            const trackTitle = document.getElementById('track-title');
            const trackSingerDirector = document.getElementById('track-singer-director');
            const trackStatus = document.getElementById('track-status');
            const trackBpm = document.getElementById('track-bpm');
            const modeIndicator = document.getElementById('mode-indicator');
            const coverHalo = document.getElementById('cover-halo');
            const artCard = document.getElementById('art-card');
            const coverArt = document.getElementById('cover-art');
            const bgArtworkBlur = document.getElementById('bg-artwork-blur');
            const ambientGlow = document.getElementById('ambient-glow');
            const playlistEl = document.getElementById('playlist');
            const queueCountEl = document.getElementById('queue-count');
            const btnLoadSouth100 = document.getElementById('btn-load-south100');
            const btnTrendingTab = document.getElementById('btn-trending-tab');
            const quickChips = document.querySelectorAll('.quick-chip');
            const categoryTabs = Array.from(document.querySelectorAll('.cat-tab'));

            const toastEl = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');

            // --- Player State ---
            let playlist = [];
            let currentIndex = 0;
            let activeCategoryIndex = 0;
            let isPlaying = false;
            let isShuffle = false;
            let isRepeat = false;
            let isMuted = false;
            let showingLikedOnly = false;
            const MAX_SONG_DURATION = 600; // Exclude tracks longer than 10 minutes (600 seconds)
            const speedOptions = [1, 1.25, 1.5, 0.85];
            let speedIndex = 0;
            let likedSongs = [];
            let toastTimer = null;

            function setActiveCategoryTab(index) {
                activeCategoryIndex = index;
                categoryTabs.forEach((tab, idx) => {
                    const isSelected = idx === index;
                    if (tab.id === 'btn-liked-tab') {
                        tab.classList.toggle('bg-rose-500', isSelected);
                        tab.classList.toggle('text-white', isSelected);
                        tab.classList.toggle('border-rose-500', isSelected);
                        tab.classList.toggle('font-bold', isSelected);
                        tab.classList.toggle('bg-white/5', !isSelected);
                        tab.classList.toggle('text-gray-300', !isSelected);
                        tab.classList.toggle('border-white/10', !isSelected);
                    } else if (tab.id === 'btn-trending-tab') {
                        tab.classList.toggle('bg-amber-500', isSelected);
                        tab.classList.toggle('text-black', isSelected);
                        tab.classList.toggle('border-amber-500', isSelected);
                        tab.classList.toggle('font-bold', isSelected);
                        tab.classList.toggle('bg-white/5', !isSelected);
                        tab.classList.toggle('text-gray-300', !isSelected);
                        tab.classList.toggle('border-white/10', !isSelected);
                    } else {
                        tab.classList.toggle('bg-accent', isSelected);
                        tab.classList.toggle('text-white', isSelected);
                        tab.classList.toggle('border-accent', isSelected);
                        tab.classList.toggle('font-bold', isSelected);
                        tab.classList.toggle('bg-white/5', !isSelected);
                        tab.classList.toggle('text-gray-300', !isSelected);
                        tab.classList.toggle('border-white/10', !isSelected);
                    }
                    if (isSelected && typeof tab.scrollIntoView === 'function') {
                        tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                });
            }

            try {
                likedSongs = JSON.parse(localStorage.getItem('aethersonic_liked_songs') || '[]')
                    .filter(s => s && s.title && (!s.duration || s.duration <= MAX_SONG_DURATION));
            } catch (e) {
                likedSongs = [];
            }

            function saveLikedSongs() {
                try {
                    localStorage.setItem('aethersonic_liked_songs', JSON.stringify(likedSongs));
                } catch (e) {}
                if (likedCountEl) likedCountEl.textContent = likedSongs.length;
                updateCurrentLikeUI();
            }

            function getTrackKey(track) {
                if (!track) return '';
                if (track.trackId) return `id::${track.trackId}`;
                return `${(track.title || '').trim().toLowerCase()}::${(track.singer || '').trim().toLowerCase()}`;
            }

            function isTrackLiked(track) {
                if (!track) return false;
                const key = getTrackKey(track);
                const titleKey = `${(track.title || '').trim().toLowerCase()}::${(track.singer || '').trim().toLowerCase()}`;
                return likedSongs.some(s => getTrackKey(s) === key || `${(s.title || '').trim().toLowerCase()}::${(s.singer || '').trim().toLowerCase()}` === titleKey);
            }

            function updateCurrentLikeUI() {
                const track = playlist[currentIndex];
                const liked = isTrackLiked(track);
                if (likeCurrentIcon && btnLikeCurrent) {
                    likeCurrentIcon.className = liked
                        ? 'ph-fill ph-heart text-sm text-rose-500'
                        : 'ph-bold ph-heart text-sm';
                    btnLikeCurrent.classList.toggle('border-rose-500/40', liked);
                    btnLikeCurrent.classList.toggle('bg-rose-500/15', liked);
                }
            }

            window.toggleLikeTrack = function (idx, event) {
                if (event) event.stopPropagation();
                const track = playlist[idx];
                if (!track) return;
                const key = getTrackKey(track);
                const titleKey = `${(track.title || '').trim().toLowerCase()}::${(track.singer || '').trim().toLowerCase()}`;
                const existingIdx = likedSongs.findIndex(s => getTrackKey(s) === key || `${(s.title || '').trim().toLowerCase()}::${(s.singer || '').trim().toLowerCase()}` === titleKey);

                if (existingIdx > -1) {
                    likedSongs.splice(existingIdx, 1);
                    showToast(`Removed "${track.title}" from Liked`);
                    if (showingLikedOnly) {
                        playlist = [...likedSongs];
                        if (currentIndex >= playlist.length) currentIndex = Math.max(0, playlist.length - 1);
                    }
                } else {
                    likedSongs.unshift({ ...track });
                    showToast(`Added "${track.title}" to Liked ❤️`);
                }
                saveLikedSongs();
                renderPlaylist();
            };

            function showToast(msg) {
                if (!toastEl || !toastMsg) return;
                toastMsg.textContent = msg;
                toastEl.classList.remove('translate-y-20', 'opacity-0');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.add('translate-y-20', 'opacity-0');
                }, 2500);
            }

            // HTML5 Audio Element
            const audioEl = new Audio();
            audioEl.volume = 0.85;

            // YouTube Player State
            let ytPlayer = null;
            let ytReady = false;
            let ytPollTimer = null;

            // Verified Healthy Audius Free Streaming Host Discovery (prevents dead/slow nodes on Vercel)
            let audiusHost = 'https://discoveryprovider.audius.co';
            let audiusCandidates = [];

            async function probeNodeHealth(nodeUrl) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 3000);
                try {
                    const res = await fetch(`${nodeUrl}/health_check`, { signal: controller.signal });
                    clearTimeout(timer);
                    return res.ok;
                } catch (e) {
                    clearTimeout(timer);
                    return false;
                }
            }

            async function resolveAudiusHost(forceRefresh = false) {
                try {
                    if (audiusCandidates.length === 0 || forceRefresh) {
                        const res = await fetch('https://api.audius.co');
                        const json = await res.json();
                        if (json && Array.isArray(json.data) && json.data.length > 0) {
                            audiusCandidates = [...json.data].sort(() => Math.random() - 0.5);
                        }
                    }
                    for (const candidate of audiusCandidates.slice(0, 5)) {
                        if (await probeNodeHealth(candidate)) {
                            audiusHost = candidate;
                            return audiusHost;
                        }
                    }

                // Stop previous playback cleanly

                ambientGlow.style.background = `radial-gradient(circle at 50% 50%, ${glowColor} 0%, transparent 65%)`;

                updateMediaSession(track);

            // Resolve full-length free audio stream (under 10 minutes)
            async function resolveFullSongStream(track) {
                await resolveAudiusHost();
                const searchTerm = `${track.title} ${track.singer || ''}`.trim();
                try {
                    const audiusRes = await fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(searchTerm)}&app_name=AetherSonic`);
                    const audiusData = await audiusRes.json();
                    if (audiusData && audiusData.data && audiusData.data.length > 0) {
                        const fullMatch = audiusData.data.find(t => !t.is_stream_gated && t.duration && t.duration >= 120 && t.duration <= MAX_SONG_DURATION)
                            || audiusData.data.find(t => !t.is_stream_gated && (!t.duration || t.duration <= MAX_SONG_DURATION));
                        if (fullMatch && fullMatch.id) {
                            track.trackId = fullMatch.id;
                            track.url = `${audiusHost}/v1/tracks/${fullMatch.id}/stream?app_name=AetherSonic`;
                            track.duration = fullMatch.duration || track.duration;
                            if (!track.artwork && fullMatch.artwork && fullMatch.artwork['480x480']) {
                                track.artwork = fullMatch.artwork['480x480'];
                            }
                            return true;
                        }
                    }
                } catch (e) {
                    console.warn('Free stream lookup skipped:', e);
                }
                return false;
            }

            async function playCurrentTrack() {
                const track = playlist[currentIndex];
                if (!track) return;

                if (track.trackId && !track.refreshedStreamNode) {
                    await resolveAudiusHost();
                    track.url = `${audiusHost}/v1/tracks/${track.trackId}/stream?app_name=AetherSonic`;
                    track.refreshedStreamNode = true;
                }

                if (!track.url && track.type !== 'youtube') {
                    trackStatus.textContent = 'LOADING FREE FULL SONG...';
                    await resolveFullSongStream(track);
                    if (track.artwork) {
                        coverArt.src = track.artwork;
                        bgArtworkBlur.style.backgroundImage = `url('${track.artwork}')`;
                    }
                }

                if (track.type === 'youtube' && track.videoId) {
                    if (ytPlayer && ytReady) {
                        if (isMuted) {
                            ytPlayer.mute();
                        } else {
                            ytPlayer.unMute();
                            ytPlayer.setVolume(Math.round(audioEl.volume * 100));
                        }
                        if (typeof ytPlayer.setPlaybackRate === 'function') {
                            ytPlayer.setPlaybackRate(speedOptions[speedIndex]);
                        }
                        ytPlayer.loadVideoById(track.videoId);
                        setPlayingState(true);
                    } else {
                        fallbackToDirectStream(track);
                    }
                    return;
                }

                if (track.url) {
                    audioEl.muted = isMuted;
                    audioEl.playbackRate = speedOptions[speedIndex];
                    audioEl.src = track.url;
                    try {
                        await audioEl.play();
                        audioEl.playbackRate = speedOptions[speedIndex];
                        setPlayingState(true);
                    } catch (err) {
                        console.warn('Playback interrupted:', err);
                        setPlayingState(false);
                        showToast('Tap Play button to start free audio');
                    }
                } else {
                    showToast('Switching to next free song...');
                    nextTrack();
                }
            }

            function nextTrack() {
                if (playlist.length === 0) return;
                if (isShuffle && playlist.length > 1) {
                    let nextIdx = currentIndex;
                    while (nextIdx === currentIndex) {
                        nextIdx = Math.floor(Math.random() * playlist.length);
                    }
                    loadTrack(nextIdx, true);
                } else {
                    const nextIdx = (currentIndex + 1) % playlist.length;
                    loadTrack(nextIdx, true);
                }
            }

            function prevTrack() {
                if (playlist.length === 0) return;
                if (audioEl.currentTime > 4) {
                    audioEl.currentTime = 0;
                    return;
                }
                const prevIdx = (currentIndex - 1 + playlist.length) % playlist.length;
                loadTrack(prevIdx, true);
            }

            function togglePlayPause() {
                const track = playlist[currentIndex];
                if (!track) return;

                if (track.type === 'youtube' && ytPlayer && ytReady) {
                    if (isPlaying) {
                        ytPlayer.pauseVideo();
                        setPlayingState(false);
                    } else {
                        if (isMuted) {
                            ytPlayer.mute();
                        } else {
                            ytPlayer.unMute();
                        }
                        ytPlayer.playVideo();
                        setPlayingState(true);
                    }
                } else {
                    if (isPlaying) {
                        audioEl.pause();
                        setPlayingState(false);
                    } else if (audioEl.src) {
                        audioEl.play().then(() => setPlayingState(true)).catch(() => playCurrentTrack());
                    } else {
                        playCurrentTrack();
                    }
                }
            }

            function rewindTrack(seconds = 10) {
                const track = playlist[currentIndex];
                if (!track) return;

                if (track.type === 'youtube' && ytPlayer && ytReady && typeof ytPlayer.getCurrentTime === 'function') {
                    const newTime = Math.max(0, (ytPlayer.getCurrentTime() || 0) - seconds);
                    ytPlayer.seekTo(newTime, true);
                    showToast(`Rewind -${seconds}s`);
                } else if (audioEl.duration && !isNaN(audioEl.duration)) {
                    audioEl.currentTime = Math.max(0, audioEl.currentTime - seconds);
                    showToast(`Rewind -${seconds}s`);
                }
            }

            function fastForwardTrack(seconds = 10) {
                const track = playlist[currentIndex];
                if (!track) return;

                if (track.type === 'youtube' && ytPlayer && ytReady && typeof ytPlayer.getCurrentTime === 'function') {
                    const dur = ytPlayer.getDuration() || track.duration || 210;
                    const newTime = Math.min(dur, (ytPlayer.getCurrentTime() || 0) + seconds);
                    ytPlayer.seekTo(newTime, true);
                    showToast(`Fast Forward +${seconds}s`);
                } else if (audioEl.duration && !isNaN(audioEl.duration)) {
                    audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + seconds);
                    showToast(`Fast Forward +${seconds}s`);
                }
            }

            function cyclePlaybackSpeed() {
                speedIndex = (speedIndex + 1) % speedOptions.length;

                audioEl.playbackRate = rate;
                if (ytPlayer && ytReady && typeof ytPlayer.setPlaybackRate === 'function') {

            // --- Fetch All Available Free Complete Full-Length Songs ---
            async function fetchAllFullLengthTracks(queriesList, badgeLabel = 'FREE') {
                await resolveAudiusHost();
                const seenIds = new Set();
                const allFullTracks = [];

                const requests = queriesList.map(q =>
                    fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(q.term)}&limit=100&app_name=AetherSonic`)
                        .then(r => r.json())
                        .then(data => ({ lang: q.lang, items: (data && data.data) ? data.data : [] }))
                        .catch(() => ({ lang: q.lang, items: [] }))
                );

                const groups = await Promise.all(requests);
                const maxLen = Math.max(0, ...groups.map(g => g.items.length));

                for (let i = 0; i < maxLen; i++) {
                    for (const group of groups) {
                        const item = group.items[i];
                        // Strictly include ONLY free, streamable, full-length songs (2 to 10 minutes max)
                        const isFreeStreamable = item && item.id && !item.is_stream_gated && item.duration && item.duration >= 120 && item.duration <= MAX_SONG_DURATION;
                        if (isFreeStreamable && !seenIds.has(item.id)) {
                            seenIds.add(item.id);
                            const userName = (item.user && item.user.name) ? item.user.name : 'Independent Artist';
                            const meta = enrichTrackMetadata({
                                trackName: item.title,
                                collectionName: item.genre || group.lang,
                                artistName: userName
                            }, group.lang);

                            const art = item.artwork
                                ? (item.artwork['480x480'] || item.artwork['1000x1000'] || item.artwork['150x150'] || '')
                                : '';

                            allFullTracks.push({
                                ...meta,
                                lang: group.lang || badgeLabel,
                                duration: item.duration,
                                type: 'stream',
                                trackId: item.id,
                                url: `${audiusHost}/v1/tracks/${item.id}/stream?app_name=AetherSonic`,
                                artwork: art || `https://placehold.co/600x600/14161D/FF5500?text=${encodeURIComponent(item.title)}`,
                                color: '#FF5500'
                            });
                        }
                    }
                }
                return allFullTracks;
            }

            async function loadSouthIndiaTop150() {
                showingLikedOnly = false;
                setActiveCategoryTab(0);
                modeIndicator.textContent = 'FETCHING ALL FREE FULL SONGS...';
                trackStatus.textContent = 'SCANNING FREE CATALOG...';

                const queries = [
                    { term: 'Telugu', lang: 'Telugu' },
                    { term: 'Tollywood', lang: 'Telugu' },
                    { term: 'Tamil', lang: 'Tamil' },
                    { term: 'Kollywood', lang: 'Tamil' },
                    { term: 'Anirudh', lang: 'Tamil' },
                    { term: 'Kannada', lang: 'Kannada' },
                    { term: 'Sandalwood', lang: 'Kannada' },
                    { term: 'Malayalam', lang: 'Malayalam' },
                    { term: 'Mollywood', lang: 'Malayalam' },
                    { term: 'Indian Remix', lang: 'South' }
                ];

                try {
                    const fullSongs = await fetchAllFullLengthTracks(queries, 'FREE');

                    if (fullSongs.length > 0) {
                        playlist = fullSongs;
                        modeIndicator.textContent = `ALL ${playlist.length} FREE FULL SONGS READY`;
                        loadTrack(0, false);
                        showToast(`Loaded all ${playlist.length} free full-length songs!`);
                    } else {
                        playlist = curatedSouthHits.map(item => ({
                            ...item,
                            type: 'stream',
                            url: '',
                            artwork: `https://placehold.co/600x600/14161D/FF5500?text=${encodeURIComponent(item.title)}`
                        }));
                        modeIndicator.textContent = `FREE FULL SONGS (${playlist.length})`;
                        loadTrack(0, false);
                    }
                } catch (err) {
                    console.warn('Free catalog fetch error:', err);
                    modeIndicator.textContent = 'FREE FULL SONGS HQ';
                }
            }

            // --- Load Dedicated Trending Free Full-Length Songs Section ---
            async function loadTrendingSongs() {
                showingLikedOnly = false;
                setActiveCategoryTab(1);
                modeIndicator.textContent = 'FETCHING TRENDING FREE SONGS...';
                trackStatus.textContent = 'LOADING TRENDING CHARTS...';

                try {
                    await resolveAudiusHost();
                    const seenIds = new Set();
                    const trendingTracks = [];

                    const endpoints = [
                        `${audiusHost}/v1/tracks/trending?limit=100&app_name=AetherSonic`,
                        `${audiusHost}/v1/tracks/trending?time=week&limit=100&app_name=AetherSonic`,
                        `${audiusHost}/v1/tracks/trending?time=month&limit=100&app_name=AetherSonic`
                    ];

                    const responses = await Promise.all(
                        endpoints.map(url =>
                            fetch(url)
                                .then(r => r.json())
                                .then(d => (d && d.data) ? d.data : [])
                                .catch(() => [])
                        )
                    );

                    for (const items of responses) {
                        for (const item of items) {
                            const isFreeStreamable = item && item.id && !item.is_stream_gated && item.duration && item.duration >= 120 && item.duration <= MAX_SONG_DURATION;
                            if (isFreeStreamable && !seenIds.has(item.id)) {
                                seenIds.add(item.id);
                                const userName = (item.user && item.user.name) ? item.user.name : 'Trending Artist';
                                const meta = enrichTrackMetadata({
                                    trackName: item.title,
                                    collectionName: item.genre || 'Trending',
                                    artistName: userName
                                }, 'Trending');
                                const art = item.artwork
                                    ? (item.artwork['480x480'] || item.artwork['1000x1000'] || item.artwork['150x150'] || '')
                                    : '';

                                trendingTracks.push({
                                    ...meta,
                                    lang: 'Trending',
                                    duration: item.duration,
                                    type: 'stream',
                                    trackId: item.id,
                                    url: `${audiusHost}/v1/tracks/${item.id}/stream?app_name=AetherSonic`,
                                    artwork: art || `https://placehold.co/600x600/14161D/FFB800?text=${encodeURIComponent(item.title)}`,
                                    color: '#FFB800'
                                });
                            }
                        }
                    }

                    if (trendingTracks.length > 0) {
                        playlist = trendingTracks;
                        modeIndicator.textContent = `TOP ${playlist.length} TRENDING FREE SONGS`;
                        loadTrack(0, false);
                        showToast(`Loaded ${playlist.length} Trending full-length songs 🔥`);
                    } else {
                        showToast('Unable to load Trending songs right now.');
                    }
                } catch (err) {
                    showToast('Failed to load Trending songs.');
                }
            }

            // --- Search All Free Full-Length Songs for a Language / Query ---
            async function searchSongs(query, tabIndex = null) {
                if (!query.trim()) return;
                showingLikedOnly = false;
                if (tabIndex !== null) {
                    setActiveCategoryTab(tabIndex);
                }
                modeIndicator.textContent = `LOADING FREE ${query.toUpperCase()} FULL SONGS...`;
                trackStatus.textContent = 'FETCHING FREE FULL TRACKS...';

                try {
                    await resolveAudiusHost();
                    const seenIds = new Set();
                    const fullTracks = [];
                    const terms = [query, `${query} song`, `${query} hits`, `${query} remix`];

                    const responses = await Promise.all(
                        terms.map(t =>
                            fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(t)}&limit=100&app_name=AetherSonic`)
                                .then(r => r.json())
                                .then(d => (d && d.data) ? d.data : [])
                                .catch(() => [])
                        )
                    );

                    for (const items of responses) {
                        for (const item of items) {
                            const isFreeStreamable = item && item.id && !item.is_stream_gated && item.duration && item.duration >= 120 && item.duration <= MAX_SONG_DURATION;
                            if (isFreeStreamable && !seenIds.has(item.id)) {
                                seenIds.add(item.id);
                                const userName = (item.user && item.user.name) ? item.user.name : 'Independent Artist';
                                const meta = enrichTrackMetadata({
                                    trackName: item.title,
                                    collectionName: item.genre || query,
                                    artistName: userName
                                }, query);
                                const art = item.artwork
                                    ? (item.artwork['480x480'] || item.artwork['1000x1000'] || item.artwork['150x150'] || '')
                                    : '';

                                fullTracks.push({
                                    ...meta,
                                    lang: query,
                                    duration: item.duration,
                                    type: 'stream',
                                    trackId: item.id,
                                    url: `${audiusHost}/v1/tracks/${item.id}/stream?app_name=AetherSonic`,
                                    artwork: art || `https://placehold.co/600x600/14161D/FF5500?text=${encodeURIComponent(item.title)}`,
                                    color: '#00F0FF'
                                });
                            }
                        }
                    }

                    if (fullTracks.length > 0) {
                        playlist = fullTracks;
                        modeIndicator.textContent = `${playlist.length} FREE ${query.toUpperCase()} SONGS`;
                        loadTrack(0, true);
                        showToast(`Loaded ${playlist.length} free full-length ${query} songs!`);
                    } else {
                        showToast(`No free full-length songs found for "${query}"`);
                    }
                } catch (e) {
                    showToast('Failed to load free songs. Check connection.');
                }
            }

            function extractYouTubeId(input) {
                const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
                const match = input.match(regExp);
                if (match && match[1]) return match[1];
                if (/^[a-zA-Z0-9_-]{11}$/.test(input.trim())) return input.trim();
                return null;
            }

            // --- Event Listeners ---
            btnPlay.addEventListener('click', togglePlayPause);
            btnPrev.addEventListener('click', prevTrack);
            btnRw.addEventListener('click', () => rewindTrack(10));
            btnFf.addEventListener('click', () => fastForwardTrack(10));
            btnNext.addEventListener('click', nextTrack);
            btnSpeed.addEventListener('click', cyclePlaybackSpeed);
            btnLikeCurrent.addEventListener('click', () => window.toggleLikeTrack(currentIndex));
            btnTrendingTab.addEventListener('click', loadTrendingSongs);

            btnLikedTab.addEventListener('click', () => {
                setActiveCategoryTab(2);
                if (likedSongs.length === 0) {
                    showingLikedOnly = true;
                    playlist = [];
                    modeIndicator.textContent = 'LIKED SONGS (0)';
                    renderPlaylist();
                    showToast('No liked songs yet! Tap ❤️ on any song.');
                    return;
                }
                showingLikedOnly = true;
                playlist = [...likedSongs];
                modeIndicator.textContent = `LIKED SONGS (${playlist.length})`;
                loadTrack(0, false);
                showToast(`Showing ${playlist.length} Liked Songs ❤️`);
            });

            btnShuffle.addEventListener('click', () => {
                isShuffle = !isShuffle;
                btnShuffle.classList.toggle('text-accent', isShuffle);
                btnShuffle.classList.toggle('border-accent/50', isShuffle);
                showToast(`Shuffle: ${isShuffle ? 'ON' : 'OFF'}`);
            });

            btnRepeat.addEventListener('click', () => {
                isRepeat = !isRepeat;
                btnRepeat.classList.toggle('text-accent', isRepeat);
                btnRepeat.classList.toggle('border-accent/50', isRepeat);
                showToast(`Repeat Track: ${isRepeat ? 'ON' : 'OFF'}`);
            });

            btnMute.addEventListener('click', () => {
                isMuted = !isMuted;
                audioEl.muted = isMuted;
                if (ytPlayer && ytReady) {
                    if (isMuted) {
                        ytPlayer.mute();
                    } else {
                        ytPlayer.unMute();
                    }
                }
                muteIcon.className = isMuted
                    ? 'ph-bold ph-speaker-slash text-base sm:text-lg'
                    : 'ph-bold ph-speaker-high text-base sm:text-lg';
                btnMute.classList.toggle('text-accent', isMuted);
                btnMute.classList.toggle('border-accent/50', isMuted);
                showToast(isMuted ? 'Audio Muted' : 'Audio Unmuted');
            });

            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

                const track = playlist[currentIndex];
                if (track && track.type === 'youtube' && ytPlayer && ytReady) {
                    const dur = ytPlayer.getDuration() || track.duration || 210;
                    ytPlayer.seekTo(pct * dur, true);
                } else if (audioEl.duration && !isNaN(audioEl.duration)) {
                    audioEl.currentTime = pct * audioEl.duration;
                }
            });

            audioEl.addEventListener('timeupdate', () => {
                const track = playlist[currentIndex];
                const cur = audioEl.currentTime || 0;
                const dur = (audioEl.duration && !isNaN(audioEl.duration)) ? audioEl.duration : (track && track.duration ? track.duration : 0);
                currentTimeEl.textContent = formatTime(cur);
                if (dur > 0) {
                    durationTimeEl.textContent = formatTime(dur);
                    progressBar.style.width = `${Math.min(100, (cur / dur) * 100)}%`;
                }
            });

            audioEl.addEventListener('error', async () => {
                const track = playlist[currentIndex];
                if (track && track.trackId && !track.retriedHost) {
                    track.retriedHost = true;
                    await resolveAudiusHost(true);
                    track.url = `${audiusHost}/v1/tracks/${track.trackId}/stream?app_name=AetherSonic`;
                    audioEl.src = track.url;
                    audioEl.play().catch(() => nextTrack());
                    return;
                }
                if (track && track.fallbackUrl && audioEl.src !== track.fallbackUrl) {
                    audioEl.src = track.fallbackUrl;
                    audioEl.play().catch(() => {});
                } else {
                    nextTrack();
                }
            });

            audioEl.addEventListener('ended', () => {
                if (isRepeat) {
                    audioEl.currentTime = 0;
                    audioEl.play().catch(() => {});
                } else {
                    nextTrack();
                }
            });

            btnLoadSouth100.addEventListener('click', loadSouthIndiaTop150);

            quickChips.forEach(chip => {
                chip.addEventListener('click', () => {
                    const q = chip.getAttribute('data-query');
                    const idx = Number(chip.getAttribute('data-cat-index'));
                    searchSongs(q, isNaN(idx) ? null : idx);
                });
            });

            // --- Horizontal Screen Swipe Gesture to Switch Language Categories ---
            let touchStartX = 0;
            let touchStartY = 0;
            let ignoreSwipe = false;

            document.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                // Ignore swipes starting on the scrubber bar or horizontal chip bar
                if (e.target.closest('#progress-container') || e.target.closest('#category-tabs-bar')) {
                    ignoreSwipe = true;
                    return;
                }
                ignoreSwipe = false;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                if (ignoreSwipe || e.changedTouches.length !== 1 || categoryTabs.length === 0) return;
                const deltaX = e.changedTouches[0].clientX - touchStartX;
                const deltaY = e.changedTouches[0].clientY - touchStartY;

                // Trigger only on clear horizontal swipe (> 65px and mostly horizontal)
                if (Math.abs(deltaX) > 65 && Math.abs(deltaX) > Math.abs(deltaY) * 1.6) {
                    const direction = deltaX < 0 ? 1 : -1; // Swipe left -> next category, swipe right -> previous category
                    const nextCatIdx = (activeCategoryIndex + direction + categoryTabs.length) % categoryTabs.length;
                    const targetTab = categoryTabs[nextCatIdx];
                    if (targetTab) {
                        targetTab.click();
                    }
                }
            }, { passive: true });

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlayPause();
                } else if (e.code === 'ArrowRight') {
                    nextTrack();
                } else if (e.code === 'ArrowLeft') {
                    prevTrack();
                }
            });

            // --- Initialize Top 150 South Indian Trending Songs on Startup ---
            saveLikedSongs();
            loadSouthIndiaTop150();
        });
    </script>
</body>
</html>
